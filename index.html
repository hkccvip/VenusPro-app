<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Venue Pro - v36 全域標籤直覺版</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { background-color: #f8fafc; color: #0f172a; -webkit-tap-highlight-color: transparent; font-family: system-ui, -apple-system, sans-serif; margin: 0; }
        .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
        .active-scale:active { transform: scale(0.96); transition: 0.1s; }
        html, body, #root { height: 100%; overflow: hidden; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        .animate-pop:active { animation: pop 0.2s ease-out; }
        input[type="date"]::-webkit-calendar-picker-indicator, input[type="time"]::-webkit-calendar-picker-indicator { opacity: 0.6; cursor: pointer; }
        .toggle-checkbox:checked { right: 0; border-color: #3b82f6; }
        .toggle-checkbox:checked + .toggle-label { background-color: #3b82f6; }
        .toggle-checkbox { right: 4; z-index: 1; border-color: #e2e8f0; transition: all 0.3s; }
        .toggle-label { background-color: #e2e8f0; transition: all 0.3s; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const Icon = ({ name, className = "" }) => {
            const spanRef = useRef(null);
            useEffect(() => {
                if (spanRef.current && window.lucide) {
                    spanRef.current.innerHTML = `<i data-lucide="${name}" class="${className}"></i>`;
                    window.lucide.createIcons({ root: spanRef.current });
                }
            }, [name, className]);
            return <span ref={spanRef} style={{ display: 'contents' }} />;
        };

        // --- ★ 精細座位資料庫 ★ ---
        const CHOIR_ZONES = {
            'B1': {
                name: 'B1 區', desc: "12點鐘方向 | 管風琴佈局",
                rows: [
                    { row: 'E', seats: [14, 15, 'ORGAN', 28, 29] },
                    { row: 'D', seats: Array.from({length: 16}, (_, i) => 14 + i) },
                    { row: 'C', seats: Array.from({length: 14}, (_, i) => 14 + i) },
                    { row: 'B', seats: Array.from({length: 12}, (_, i) => 14 + i) },
                    { row: 'A', seats: Array.from({length: 12}, (_, i) => 14 + i) }
                ], total: 58
            },
            'B2': {
                name: 'B2 區', desc: "11點鐘方向 | 梯形佈局",
                rows: [
                    { row: 'F', seats: Array.from({length: 13}, (_, i) => 30 + i) },
                    { row: 'E', seats: Array.from({length: 12}, (_, i) => 30 + i) },
                    { row: 'D', seats: Array.from({length: 11}, (_, i) => 30 + i) },
                    { row: 'C', seats: Array.from({length: 10}, (_, i) => 30 + i) },
                    { row: 'B', seats: Array.from({length:  9}, (_, i) => 30 + i) },
                    { row: 'A', seats: Array.from({length:  8}, (_, i) => 30 + i) }
                ], total: 63
            }
        };
        const COMBINED_TOTAL_SEATS = CHOIR_ZONES['B1'].total + CHOIR_ZONES['B2'].total;

        const ChoirSeatMap = ({ blockedSeats, setBlockedSeats }) => {
            const [activeZone, setActiveZone] = useState('B1');
            const toggleSeat = (zoneId, rowLetter, seatNum) => {
                const seatId = `${zoneId}_${rowLetter}${seatNum}`;
                if (blockedSeats.includes(seatId)) setBlockedSeats(blockedSeats.filter(id => id !== seatId));
                else setBlockedSeats([...blockedSeats, seatId]);
            };
            const toggleRow = (zoneId, rowLetter, seatArray) => {
                const validSeats = seatArray.filter(s => s !== 'ORGAN').map(s => `${zoneId}_${rowLetter}${s}`);
                const allBlocked = validSeats.every(s => blockedSeats.includes(s));
                if (allBlocked) setBlockedSeats(blockedSeats.filter(id => !validSeats.includes(id)));
                else {
                    const newBlocked = [...blockedSeats];
                    validSeats.forEach(s => { if(!newBlocked.includes(s)) newBlocked.push(s); });
                    setBlockedSeats(newBlocked);
                }
            };
            const zoneData = CHOIR_ZONES[activeZone];
            return (
                <div className="flex flex-col items-center bg-slate-900 rounded-[32px] p-4 py-8 shadow-inner w-full overflow-x-auto">
                    <div className="flex bg-slate-800 p-1 rounded-xl mb-6 shadow-md border border-slate-700">
                        {Object.keys(CHOIR_ZONES).map(zone => (
                            <button key={zone} onClick={() => setActiveZone(zone)} className={`px-6 py-2 text-sm font-black rounded-lg transition-colors ${activeZone === zone ? 'bg-indigo-500 text-white shadow-sm' : 'text-slate-400 hover:text-white'}`}>
                                {CHOIR_ZONES[zone].name}
                                {blockedSeats.filter(s => s.startsWith(zone)).length > 0 && (<span className="ml-2 bg-rose-500 text-white text-[9px] px-1.5 py-0.5 rounded-full">{blockedSeats.filter(s => s.startsWith(zone)).length}</span>)}
                            </button>
                        ))}
                    </div>
                    <div className="text-center mb-6"><p className="text-slate-400 text-[10px] uppercase font-bold tracking-widest">{zoneData.desc}</p></div>
                    <div className="space-y-3 flex flex-col items-center min-h-[220px]">
                        {zoneData.rows.map(rowData => (
                            <div key={rowData.row} className="flex items-center justify-center space-x-1">
                                <button onClick={() => toggleRow(activeZone, rowData.row, rowData.seats)} className="w-6 h-6 mr-2 flex items-center justify-center bg-slate-700 text-white text-[10px] font-black rounded-md active-scale border border-slate-600 hover:bg-indigo-500 transition-colors">{rowData.row}</button>
                                <div className="flex space-x-1">
                                    {rowData.seats.map((seat, index) => {
                                        if (seat === 'ORGAN') return (<div key={`organ-${index}`} className="flex items-center justify-center px-4"><div className="bg-slate-800 text-slate-500 text-[10px] font-bold px-8 py-2 rounded-lg border border-slate-700/50 flex flex-col items-center"><Icon name="music" className="w-4 h-4 mb-1 opacity-50" /><span>管風琴</span></div></div>);
                                        const seatId = `${activeZone}_${rowData.row}${seat}`;
                                        const isBlocked = blockedSeats.includes(seatId);
                                        return (
                                            <button key={seatId} onClick={() => toggleSeat(activeZone, rowData.row, seat)} className={`w-7 h-8 rounded-t-xl rounded-b-sm border-b-4 transition-all duration-200 flex items-center justify-center text-[9px] font-black shadow-md active-scale ${isBlocked ? 'bg-rose-500 border-rose-700 text-white transform scale-95' : 'bg-slate-200 border-slate-400 text-slate-800 hover:bg-white'}`}>{seat}</button>
                                        );
                                    })}
                                </div>
                                <div className="w-6 h-6 ml-2 flex items-center justify-center text-slate-500 text-[10px] font-black">{rowData.row}</div>
                            </div>
                        ))}
                    </div>
                    <div className="mt-8 w-4/5 h-10 bg-slate-700/80 backdrop-blur-sm rounded-t-[2rem] flex items-center justify-center text-white font-black tracking-widest text-sm border-t border-slate-600 shadow-[0_-10px_20px_rgba(0,0,0,0.3)]">STAGE 舞台</div>
                </div>
            );
        };

        const SeatMapDrawer = ({ bgImageBase64, onSave, onClose }) => {
            const canvasRef = useRef(null);
            const [isDrawing, setIsDrawing] = useState(false);
            const [imgObj, setImgObj] = useState(null);

            useEffect(() => {
                const canvas = canvasRef.current; const ctx = canvas.getContext('2d');
                const img = new Image();
                img.onload = () => {
                    canvas.width = img.width; canvas.height = img.height;
                    ctx.drawImage(img, 0, 0); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
                    ctx.strokeStyle = 'rgba(244, 63, 94, 0.5)'; ctx.lineWidth = Math.max(img.width * 0.015, 10); 
                    setImgObj(img);
                };
                img.src = bgImageBase64;
            }, [bgImageBase64]);

            const getCoordinates = (e) => {
                const canvas = canvasRef.current; const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width; const scaleY = canvas.height / rect.height;
                return { x: (e.clientX - rect.left) * scaleX, y: (e.clientY - rect.top) * scaleY };
            };

            const startDrawing = (e) => { const { x, y } = getCoordinates(e); const ctx = canvasRef.current.getContext('2d'); ctx.beginPath(); ctx.moveTo(x, y); setIsDrawing(true); };
            const draw = (e) => { if (!isDrawing) return; const { x, y } = getCoordinates(e); const ctx = canvasRef.current.getContext('2d'); ctx.lineTo(x, y); ctx.stroke(); };
            const stopDrawing = () => { if (isDrawing) { const ctx = canvasRef.current.getContext('2d'); ctx.closePath(); setIsDrawing(false); } };
            const handleClear = () => { if(!imgObj) return; const canvas = canvasRef.current; const ctx = canvas.getContext('2d'); ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.drawImage(imgObj, 0, 0); };
            const handleSave = () => { onSave(canvasRef.current.toDataURL('image/jpeg', 0.8)); };

            return (
                <div className="fixed inset-0 z-[400] bg-slate-900 flex flex-col">
                    <div className="flex justify-between items-center p-4 bg-slate-950 text-white safe-top shadow-md z-10">
                        <button onClick={onClose} className="p-2 active-scale"><Icon name="x" className="w-6 h-6" /></button>
                        <span className="font-black text-sm tracking-widest">手指塗鴉封位</span>
                        <button onClick={handleSave} className="bg-rose-500 px-4 py-1.5 rounded-full font-bold text-sm active-scale">儲存</button>
                    </div>
                    <div className="flex-1 overflow-hidden flex items-center justify-center bg-slate-800 relative touch-none">
                        <canvas ref={canvasRef} className="max-w-full max-h-full object-contain touch-none cursor-crosshair shadow-2xl" onPointerDown={startDrawing} onPointerMove={draw} onPointerUp={stopDrawing} onPointerOut={stopDrawing} />
                        <div className="absolute bottom-10 flex gap-4"><button onClick={handleClear} className="bg-slate-700/80 backdrop-blur-md text-white px-6 py-3 rounded-full font-bold text-sm active-scale flex items-center shadow-lg border border-white/10"><Icon name="rotate-ccw" className="w-4 h-4 mr-2" /> 重新劃位</button></div>
                    </div>
                </div>
            );
        };

        const DEFAULT_VENUES_DATA = {
            "音樂廳 合唱席 (多區單座聯動版)": { capacity: COMBINED_TOTAL_SEATS, capacityStr: `合唱席預設共 ${COMBINED_TOTAL_SEATS} 座`, details: "支援 B1 及 B2 區跨區精細點算", tags: { reminders: ["Pre-Talk 演前講座 (需提早)"], vip: ["合唱席預留"], audience: ["B1/B2專屬通道進場"], rp: ["清場廣播"], tech: ["合唱席封閉"] } },
            "大劇院": { capacity: 1708, capacityStr: "座位總數：1708", details: "堂座(1): 297 | 堂座(2): 491 | 樓座: 425 | 高席: 495", tags: { reminders: ["酒會 Reception"], vip: ["高席 VIP 預留"], audience: ["遲到者第一幕後進場"], rp: ["對講機 Channel 2"], tech: ["樂池封閉"] } },
            "小劇場 (劇場)": { capacity: 496, capacityStr: "最大座位數：496", details: "單向: 321 | 四向: 496", tags: { reminders: ["演後座談"], vip: ["入口接待處"], audience: ["自由入座"], rp: ["排隊動線指引"], tech: ["單向配置"] } },
            "大堂 (Foyer)": { capacity: 0, capacityStr: "開放式空間", details: "無固定座位", tags: { reminders: ["大型酒會"], vip: ["主禮嘉賓接待處"], audience: ["人群管制"], rp: ["背景板佈置"], tech: ["流動電源"] } }
        };

        const DEFAULT_TIMELINE_TAGS = ["FOH 開放", "觀眾席開放", "節目開始", "遲到者進場點", "中場休息", "下半場開始", "節目結束"];
        const TICKETING_OPTIONS = ["URBTIX", "Artmate", "Popticket", "大麥網", "自印門票"];
        const VENUE_NAMES = Object.keys(DEFAULT_VENUES_DATA);
        const CATEGORY_NAMES = { reminders: "特別安排 (Staffing)", vip: "嘉賓接待 (VIP)", audience: "觀眾管理 (Audience)", rp: "RP 空間任務 (Logistics)", tech: "技術封位 (Tech Blocks)" };
        const getTodayDate = () => new Date().toISOString().split('T')[0];

        const App = () => {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [reportData, setReportData] = useState(null);
            const [lightboxImage, setLightboxImage] = useState(null);
            const [isProcessing, setIsProcessing] = useState(false);
            const fileInputRef = useRef(null);
            const mapInputRef = useRef(null);
            
            const [records, setRecords] = useState(() => { try { return JSON.parse(localStorage.getItem('balance_pro_records_v14')) || []; } catch(e) { return []; } });
            
            const [venuesData, setVenuesData] = useState(() => {
                const defaultData = JSON.parse(JSON.stringify(DEFAULT_VENUES_DATA));
                try {
                    const saved = localStorage.getItem('vp_custom_venues_v36');
                    if (saved) {
                        const parsed = JSON.parse(saved);
                        Object.keys(defaultData).forEach(venue => {
                            if (parsed[venue] && parsed[venue].tags) {
                                Object.keys(defaultData[venue].tags).forEach(category => {
                                    if (Array.isArray(parsed[venue].tags[category])) defaultData[venue].tags[category] = parsed[venue].tags[category];
                                });
                            }
                        });
                    }
                } catch (e) {}
                return defaultData;
            });

            const [timelineTags, setTimelineTags] = useState(() => {
                try {
                    const saved = localStorage.getItem('vp_custom_timeline_v36');
                    if (saved) { const parsed = JSON.parse(saved); if (Array.isArray(parsed)) return parsed; }
                } catch(e) {}
                return [...DEFAULT_TIMELINE_TAGS];
            });
            
            const [form, setForm] = useState({
                date: getTodayDate(), venue: VENUE_NAMES[0], event_name: "", 
                organizer: "", ticketing: "URBTIX", duration_h: "2", duration_m: "0",
                has_intermission: false, int_duration: "15", int_start: "", int_end: "",
                reminders: "", vip_pillar: "", audience_pillar: "", rp_tasks: "", tech_blocks: "", 
                timeline_events: [], reference_images: [], seat_map: null
            });

            const [blockedDetailedSeats, setBlockedDetailedSeats] = useState([]);
            const [tlTime, setTlTime] = useState("");
            const [tlEvent, setTlEvent] = useState("");
            const [drawingBgImage, setDrawingBgImage] = useState(null);

            const [tagManagerView, setTagManagerView] = useState('venue'); 
            const [tmVenue, setTmVenue] = useState(VENUE_NAMES[0]);
            const [tmCategory, setTmCategory] = useState('reminders');
            const [newTagText, setNewTagText] = useState("");
            const [editingTag, setEditingTag] = useState(null); 

            useEffect(() => { if (window.lucide) window.lucide.createIcons(); });
            useEffect(() => {
                try { 
                    localStorage.setItem('balance_pro_records_v14', JSON.stringify(records)); 
                    localStorage.setItem('vp_custom_venues_v36', JSON.stringify(venuesData));
                    localStorage.setItem('vp_custom_timeline_v36', JSON.stringify(timelineTags));
                } catch (e) {} 
            }, [records, venuesData, timelineTags]);
            useEffect(() => { setBlockedDetailedSeats([]); }, [form.venue]);

            // --- 圖片處理 ---
            const compressImage = (file, quality = 0.5) => {
                return new Promise((resolve) => {
                    const reader = new FileReader(); reader.readAsDataURL(file);
                    reader.onload = (e) => {
                        const img = new Image(); img.src = e.target.result;
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            const MAX_WIDTH = 1000; const MAX_HEIGHT = 1000;
                            let width = img.width; let height = img.height;
                            if (width > height) { if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; } } 
                            else { if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; } }
                            canvas.width = width; canvas.height = height;
                            const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, width, height);
                            resolve(canvas.toDataURL('image/jpeg', quality));
                        };
                    };
                });
            };

            const handleImageUpload = async (e) => {
                const files = Array.from(e.target.files);
                if (!files.length) return;
                setIsProcessing(true);
                setTimeout(async () => {
                    const newImages = [];
                    for (let file of files) { newImages.push(await compressImage(file, 0.5)); }
                    setForm(prev => ({ ...prev, reference_images: [...prev.reference_images, ...newImages] }));
                    if (fileInputRef.current) fileInputRef.current.value = "";
                    setIsProcessing(false);
                }, 50);
            };

            const handleMapUpload = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                setIsProcessing(true);
                setTimeout(async () => {
                    const base64 = await compressImage(file, 0.8);
                    setDrawingBgImage(base64);
                    if (mapInputRef.current) mapInputRef.current.value = "";
                    setIsProcessing(false);
                }, 50);
            };

            const removeImageFromForm = (indexToRemove) => { setForm(prev => ({ ...prev, reference_images: prev.reference_images.filter((_, i) => i !== indexToRemove) })); };
            const removeSeatMap = () => { setForm(prev => ({ ...prev, seat_map: null })); };

            // --- 標籤與時間線邏輯 ---
            const appendTag = (field, text) => {
                if (field === 'timeline_input') { setTlEvent(text); return; }
                setForm(prev => {
                    const current = prev[field];
                    if (current.includes(text)) return prev;
                    if (field === 'tech_blocks') return { ...prev, [field]: current ? `${current}, ${text}` : text };
                    return { ...prev, [field]: current ? `${current}\n- ${text}` : `- ${text}` };
                });
            };

            // ★ v36 新增：直覺在表單中新增標籤 ★
            const handleQuickAddTag = (venue, category) => {
                const newTag = window.prompt(`請輸入要新增至「${CATEGORY_NAMES[category]}」的標籤：`);
                if (newTag && newTag.trim()) {
                    const updated = JSON.parse(JSON.stringify(venuesData));
                    if (!updated[venue]) updated[venue] = { tags: {} };
                    if (!updated[venue].tags[category]) updated[venue].tags[category] = [];
                    updated[venue].tags[category].push(newTag.trim());
                    setVenuesData(updated);
                }
            };

            const handleQuickAddTimelineTag = () => {
                const newTag = window.prompt(`請輸入要新增的「時間線標籤」：`);
                if (newTag && newTag.trim()) {
                    setTimelineTags([...timelineTags, newTag.trim()]);
                }
            };

            // ★ v36 新增：跳躍至標籤管理員 ★
            const goToTagManager = (venue, category) => {
                setTagManagerView('venue');
                setTmVenue(venue);
                setTmCategory(category);
                setActiveTab('tagManager');
            };

            const handleAddTimelineEvent = () => {
                if (!tlTime || !tlEvent.trim()) return;
                const newEvents = [...form.timeline_events, { time: tlTime, event: tlEvent.trim() }];
                newEvents.sort((a, b) => {
                    let timeA = a.time; let timeB = b.time;
                    if (timeA >= "00:00" && timeA <= "05:00") timeA = "24" + timeA.substring(2);
                    if (timeB >= "00:00" && timeB <= "05:00") timeB = "24" + timeB.substring(2);
                    return timeA.localeCompare(timeB);
                });
                setForm(prev => ({ ...prev, timeline_events: newEvents }));
                setTlEvent(""); 
            };
            const handleRemoveTimelineEvent = (index) => { setForm(prev => ({ ...prev, timeline_events: form.timeline_events.filter((_, i) => i !== index) })); };

            const resetForm = () => {
                setForm({ 
                    date: getTodayDate(), venue: VENUE_NAMES[0], event_name: "", organizer: "", ticketing: "URBTIX", duration_h: "2", duration_m: "0",
                    has_intermission: false, int_duration: "15", int_start: "", int_end: "",
                    reminders: "", vip_pillar: "", audience_pillar: "", rp_tasks: "", tech_blocks: "", timeline_events: [], reference_images: [], seat_map: null
                });
                setBlockedDetailedSeats([]); setTlTime(""); setTlEvent("");
            };

            const generateAndSaveReport = () => {
                if (!form.event_name.trim()) { alert("請輸入「節目名稱」！"); return; }
                const rpArray = form.rp_tasks.split('\n').map(t => t.replace(/^- /, '').replace(/^任務\d+:/, '').trim()).filter(t => t !== '').map((task, i) => ({ task: `任務 ${i + 1}`, detail: task }));
                
                let calculatedProgrammes = null;
                let finalTechBlocks = form.tech_blocks;

                if (form.venue === "音樂廳 合唱席 (多區單座聯動版)") {
                    calculatedProgrammes = COMBINED_TOTAL_SEATS - blockedDetailedSeats.length;
                    if (blockedDetailedSeats.length > 0) {
                        const grouped = blockedDetailedSeats.reduce((acc, seatId) => {
                            const [zone, seat] = seatId.split('_'); const row = seat.charAt(0); const num = parseInt(seat.slice(1));
                            if (!acc[zone]) acc[zone] = {}; if (!acc[zone][row]) acc[zone][row] = [];
                            acc[zone][row].push(num); return acc;
                        }, {});
                        let seatText = Object.keys(grouped).sort().map(zone => {
                            let zoneText = `【${zone}區】\n`;
                            zoneText += Object.keys(grouped[zone]).sort().map(row => `  ${row} 行: ` + grouped[zone][row].sort((a,b)=>a-b).join(', ')).join('\n');
                            return zoneText;
                        }).join('\n');
                        const svgText = `[合唱席 智能精細封位] (共封閉 ${blockedDetailedSeats.length} 座)\n${seatText}`;
                        finalTechBlocks = finalTechBlocks ? `${svgText}\n\n${finalTechBlocks}` : svgText;
                    }
                }

                const newReport = {
                    id: Date.now().toString(), timestamp: new Date().getTime(),
                    date: form.date, venue: form.venue, event_name: form.event_name,
                    organizer: form.organizer, ticketing: form.ticketing, duration_h: form.duration_h, duration_m: form.duration_m,
                    has_intermission: form.has_intermission, int_duration: form.int_duration, int_start: form.int_start, int_end: form.int_end,
                    reminders: form.reminders, vip_pillar: form.vip_pillar, audience_pillar: form.audience_pillar, rp_pillar: rpArray.length > 0 ? rpArray : [{task: "常規巡查", detail: "保持動線順暢"}],
                    tech_blocks: finalTechBlocks || "無", timeline_events: form.timeline_events, reference_images: form.reference_images, seat_map: form.seat_map, programmes_count: calculatedProgrammes
                };
                setRecords(prev => [newReport, ...prev]);
                setReportData(newReport);
                setActiveTab('report');
            };

            const viewRecord = (record) => { setReportData(record); setActiveTab('report'); };
            const deleteRecord = (id, e) => {
                e.stopPropagation();
                if(confirm("確定刪除紀錄？")) {

                        )}
                    </main>

                    <nav className="bg-white border-t border-slate-200 px-6 pb-12 pt-4 flex items-center justify-between sticky bottom-0 z-50 safe-bottom">
                        <button onClick={() => setActiveTab('dashboard')} className={`flex flex-col items-center p-2 transition-colors ${activeTab === 'dashboard' ? 'text-blue-600' : 'text-slate-400'}`}><Icon name="layout-dashboard" className="w-7 h-7 mb-1.5" /><span className="text-[10px] font-black uppercase">總覽</span></button>
                        <div className="relative -top-10"><button onClick={() => { resetForm(); setActiveTab('builder'); }} className="w-20 h-20 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-full flex items-center justify-center shadow-[0_8px_25px_rgba(59,130,246,0.4)] border-4 border-white active-scale"><Icon name="plus" className="w-10 h-10 text-white" /></button></div>
                        <button onClick={() => setActiveTab('history')} className={`flex flex-col items-center p-2 transition-colors ${activeTab === 'history' ? 'text-blue-600' : 'text-slate-400'}`}><Icon name="history" className="w-7 h-7 mb-1.5" /><span className="text-[10px] font-black uppercase tracking-tighter">紀錄</span></button>
                    </nav>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
