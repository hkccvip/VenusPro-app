```html
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Balance Pro - 極簡防呆版</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { background-color: #050505; color: white; -webkit-tap-highlight-color: transparent; font-family: system-ui, sans-serif; margin: 0; }
        .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
        .active-scale:active { transform: scale(0.94); transition: 0.1s; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .animate-spin-custom { animation: spin 1s linear infinite; }
        html, body, #root { height: 100%; overflow: hidden; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        const App = () => {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [isProcessing, setIsProcessing] = useState(false);
            const [aiResult, setAiResult] = useState(null);
            const [errorMessage, setErrorMessage] = useState("");
            const [isDemoMode, setIsDemoMode] = useState(false);
            const [userKey, setUserKey] = useState(localStorage.getItem('foh_v9_key') || "");
            const fileInputRef = useRef(null);

            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
                localStorage.setItem('foh_v9_key', userKey);
            }, [activeTab, aiResult, userKey, errorMessage]);

            // --- 診斷金鑰狀態 ---
            const testKeyStatus = async () => {
                if (!userKey) { alert("請先輸入金鑰！"); return; }
                setIsProcessing(true);
                try {
                    const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${userKey}`);
                    const data = await resp.json();
                    if (resp.ok) {
                        alert("✅ 恭喜！金鑰完全正常，且 VPN 連線成功！可以開始拍照分析了。");
                    } else {
                        alert(`❌ 金鑰無效或被封鎖：\n${data.error?.message}\n\n請重新申請金鑰或檢查 VPN。`);
                    }
                } catch (err) {
                    alert(`❌ 網路錯誤 (VPN可能斷線)：\n${err.message}`);
                } finally {
                    setIsProcessing(false);
                }
            };

            const runDemo = () => {
                setIsProcessing(true);
                setTimeout(() => {
                    setAiResult({
                        event_name: "美狄亞 MEDEA (演示)",
                        vip_pillar: "接待處設於大堂中央 (2R 4C)。VIP 席位 CA 1-10 號。",
                        audience_pillar: "嚴禁攝影。遲到者中場進場。",
                        rp_pillar: [
                            {task: "接待長檯 (2R)", detail: "Foyer 正門，配 4 椅及白檯布。"},
                            {task: "封位區", detail: "CA5-17 排紅繩封閉。"}
                        ],
                        tech_blocks: "CA5-17"
                    });
                    setActiveTab('report');
                    setIsProcessing(false);
                }, 800);
            };

            const handleFileSelect = async (e) => {
                if (isDemoMode) { runDemo(); return; }
                const file = e.target.files[0];
                if (!file) return;
                if (!userKey) { setErrorMessage("請先進入右上角設定 API 金鑰。"); return; }

                setIsProcessing(true);
                setErrorMessage("");
                
                const reader = new FileReader();
                reader.onloadend = async () => {
                    const base64Data = reader.result.split(',')[1];
                    const prompt = `分析照片，回傳 JSON：{"event_name":"活動","vip_pillar":"嘉賓","audience_pillar":"觀眾","rp_pillar":[{"task":"物資","detail":"擺位"}],"tech_blocks":"席號"}`;
                    
                    // 強制鎖定最新且唯一的 flash 模型
                    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${userKey}`;

                    try {
                        const response = await fetch(url, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ contents: [{ parts: [{ text: prompt }, { inlineData: { mimeType: "image/png", data: base64Data } }] }] })
                        });

                        const data = await response.json();
                        if (!response.ok) {
                            throw new Error(data.error?.message || "伺服器拒絕連線");
                        }

                        const cleanText = data.candidates[0].content.parts[0].text.replace(/```json/g, "").replace(/```/g, "").trim();
                        setAiResult(JSON.parse(cleanText));
                        setActiveTab('report');
                    } catch (err) {
                        setErrorMessage(err.message);
                    } finally {
                        setIsProcessing(false);
                    }
                };
                reader.readAsDataURL(file);
            };

            return (
                <div className="flex flex-col h-full overflow-hidden select-none">
                    <header className="px-6 pt-12 pb-5 border-b border-white/5 bg-black/60 backdrop-blur-xl flex justify-between items-center">
                        <div>
                            <h1 className="text-2xl font-black italic tracking-tighter text-indigo-500 uppercase leading-none">BALANCE PRO <span className="text-xs text-gray-500">v9</span></h1>
                        </div>
                        <button onClick={() => setActiveTab('settings')} className="p-3 bg-white/5 rounded-2xl text-gray-400 active-scale border border-white/10">
                            <i data-lucide="settings" className="w-6 h-6"></i>
                        </button>
                    </header>

                    <main className="flex-1 overflow-y-auto p-6 pb-40">
                        {activeTab === 'dashboard' && (
                            <div className="space-y-8 animate-in fade-in">
                                <h2 className="text-4xl font-black text-white leading-tight">運營平衡</h2>
                                
                                <div className="grid grid-cols-2 gap-4">
                                    <div className="bg-gray-900/50 border border-amber-500/10 p-6 rounded-[32px] shadow-lg">
                                        <p className="text-amber-500 text-[10px] font-bold uppercase tracking-widest mb-1">嘉賓抵達</p>
                                        <p className="text-4xl font-black text-white italic">04</p>
                                    </div>
                                    <div className="bg-gray-900/50 border border-indigo-500/10 p-6 rounded-[32px] shadow-lg">
                                        <p className="text-indigo-500 text-[10px] font-bold uppercase tracking-widest mb-1">觀眾進場</p>
                                        <p className="text-4xl font-black text-white italic">128</p>
                                    </div>
                                </div>

                                {errorMessage && (
                                    <div className="bg-rose-500/10 border border-rose-500/30 p-6 rounded-[32px] space-y-3 shadow-xl">
                                        <h4 className="text-rose-500 font-black flex items-center italic text-lg"><i data-lucide="alert-circle" className="mr-2"></i> 分析失敗</h4>
                                        <p className="text-sm text-rose-100 font-bold leading-relaxed">{errorMessage}</p>
                                        <div className="flex space-x-2 pt-2">
                                            <button onClick={() => setActiveTab('settings')} className="flex-1 bg-rose-600 py-3 rounded-xl font-black text-xs uppercase">檢查金鑰</button>
                                            <button onClick={() => setIsDemoMode(true)} className="flex-1 bg-white/10 py-3 rounded-xl font-black text-xs uppercase">切換演示</button>
                                        </div>
                                    </div>
                                )}

                                <div className="bg-white/5 p-8 rounded-[40px] border border-white/10 active-scale shadow-2xl" onClick={() => fileInputRef.current.click()}>
                                    <h4 className="font-black text-indigo-400 text-xl flex items-center mb-2 italic"><i data-lucide="camera" className="mr-2"></i>智聯掃描</h4>
                                    <p className="text-lg text-gray-400 leading-relaxed font-bold italic">拍攝或匯入文件，AI 將同步嘉賓、觀眾與 RP 空間任務。</p>
                                </div>
                            </div>
                        )}

                        {activeTab === 'settings' && (
                            <div className="space-y-8 animate-in slide-in-from-right-10 pb-10">
                                <h2 className="text-3xl font-black text-white italic">系統設定</h2>
                                <div className="space-y-6">
                                    <div className="space-y-3">
                                        <label className="text-[10px] font-black text-gray-500 uppercase tracking-widest">Google API Key</label>
                                        <input 
                                            type="password"
                                            placeholder="AIzaSy..." 
                                            className="w-full bg-gray-900 border border-white/10 p-5 rounded-2xl text-white font-mono text-lg"
                                            value={userKey}
                                            onChange={(e) => setUserKey(e.target.value)}
                                        />
                                        <button onClick={testKeyStatus} className="w-full bg-indigo-500/20 text-indigo-400 font-bold py-4 rounded-xl text-sm border border-indigo-500/30 active-scale">
                                            診斷金鑰狀態 (需開 VPN)
                                        </button>
                                    </div>

                                    <div className="flex items-center justify-between p-6 bg-amber-500/10 border border-amber-500/20 rounded-3xl">
                                        <div className="space-y-1">
                                            <p className="font-black text-amber-500 text-lg uppercase italic tracking-tighter">Demo Mode (模擬)</p>
                                            <p className="text-[10px] font-bold text-amber-500/60 uppercase">無需金鑰，直接體驗</p>
                                        </div>
                                        <input type="checkbox" className="w-8 h-8 rounded-lg accent-amber-500" checked={isDemoMode} onChange={() => setIsDemoMode(!isDemoMode)} />
                                    </div>

                                    <button onClick={() => setActiveTab('dashboard')} className="w-full bg-indigo-600 text-white font-black py-6 rounded-[32px] text-xl shadow-2xl active-scale">儲存並返回</button>
                                </div>
                            </div>
                        )}

                        {activeTab === 'report' && aiResult && (
                            <div className="space-y-8 animate-in slide-in-from-bottom-10 pb-20 text-white">
                                <h2 className="text-3xl font-black text-indigo-500 italic border-b-2 border-indigo-500/30 pb-2 uppercase tracking-tighter">{aiResult.event_name}</h2>
                                <section className="bg-amber-500/5 border border-amber-500/20 p-6 rounded-[40px] space-y-2">
                                    <h3 className="text-xs font-black text-amber-500 uppercase tracking-widest"><i data-lucide="star" className="inline w-4 h-4 mr-2"></i>VIP 接待</h3>
                                    <p className="text-xl font-bold leading-relaxed">{aiResult.vip_pillar}</p>
                                </section>
                                <section className="bg-indigo-500/5 border border-indigo-500/20 p-6 rounded-[40px] space-y-2">
                                    <h3 className="text-xs font-black text-indigo-400 uppercase tracking-widest"><i data-lucide="users" className="inline w-4 h-4 mr-2"></i>觀眾管理</h3>
                                    <p className="text-xl font-bold leading-relaxed">{aiResult.audience_pillar}</p>
                                </section>
                                <section className="space-y-4">
                                    <h3 className="text-emerald-500 font-black text-xs uppercase tracking-widest px-2"><i data-lucide="box" className="inline w-4 h-4 mr-2"></i>RP 擺位清單</h3>
                                    {aiResult.rp_pillar.map((item, i) => (
                                        <div key={i} className="bg-gray-900/50 border-l-4 border-emerald-500 p-6 rounded-2xl space-y-1">
                                            <p className="text-2xl font-black tracking-tight">{item.task}</p>
                                            <p className="text-lg text-gray-400 font-medium italic leading-snug">{item.detail}</p>
                                        </div>
                                    ))}
                                </section>
                                <button onClick={() => setActiveTab('dashboard')} className="w-full bg-white/5 border border-white/10 text-gray-500 font-black py-6 rounded-[32px] text-xl uppercase italic">Close</button>
                            </div>
                        )}
                    </main>

                    <nav className="bg-black border-t border-white/5 px-4 pb-12 pt-4 flex items-center justify-around sticky bottom-0 z-50 safe-bottom">
                        <button onClick={() => setActiveTab('dashboard')} className={`flex-1 flex flex-col items-center ${activeTab === 'dashboard' ? 'text-white' : 'text-gray-600'}`}>
                            <i data-lucide="layout-dashboard" className="w-8 h-8 mb-1"></i>
                            <span className="text-[10px] font-black uppercase">總覽</span>
                        </button>
                        <div className="relative -top-12 px-4">
                            <button onClick={() => fileInputRef.current.click()} className="w-24 h-24 bg-gradient-to-br from-indigo-500 to-indigo-700 rounded-full flex items-center justify-center shadow-[0_0_50px_rgba(79,70,229,0.7)] border-[8px] border-[#050505] active-scale">
                                <i data-lucide="camera" className="w-10 h-10 text-white"></i>
                            </button>
                            <input type="file" ref={fileInputRef} onChange={handleFileSelect} accept="image/*" className="hidden" />
                        </div>
                        <button onClick={() => setActiveTab('report')} className={`flex-1 flex flex-col items-center ${activeTab === 'report' ? 'text-emerald-500' : 'text-gray-600'}`}>
                            <i data-lucide="clipboard-list" className="w-8 h-8 mb-1"></i>
                            <span className="text-[10px] font-black uppercase">報告</span>
                        </button>
                    </nav>

                    {isProcessing && (
                        <div className="fixed inset-0 bg-black/98 z-[100] flex flex-col items-center justify-center p-12 text-center">
                            <div className="animate-spin-custom mb-10 text-indigo-500"><i data-lucide="refresh-cw" className="w-20 h-20"></i></div>
                            <h3 className="text-4xl font-black italic tracking-widest text-white uppercase tracking-tighter">Syncing</h3>
                            <p className="text-gray-400 text-xl mt-6 font-bold leading-relaxed">{isDemoMode ? '演示同步中...' : '正在分析照片並平衡任務...'}</p>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>


```
