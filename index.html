<!DOCTYPE html>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>

    <style>
        body { background-color: #f8fafc; color: #0f172a; -webkit-tap-highlight-color: transparent; font-family: system-ui, -apple-system, sans-serif; margin: 0; }

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- 原廠預設標籤資料庫 ---
        const DEFAULT_VENUES_DATA = {
            "演奏廳 (音樂廳)": {
                capacity: "座位總數：1957", details: "堂座(1): 481 | 堂座(2): 563 | 樓座: 629 | 合唱席: 284",
                tags: { 
                    reminders: ["Pre-Talk 演前講座 (需4位PTU提早)", "酒會 Reception (需6-8位PTU)", "演後座談 Post-Talk", "簽名會 (需拉線及人手)"],
                    vip: ["大堂 2R4C 接待處", "需專人引導至堂座", "合唱席 VIP 預留", "會後合照安排", "媒體登記處"], 
                    audience: ["嚴禁攝影及錄音", "遲到者樂章間進場", "派發場刊", "樓座指引"], 
                    rp: ["Foyer 放置 A3 指示牌", "拉起紅繩圍封", "清場廣播"], 
                    tech: ["3個合唱席", "5個合唱席", "堂座觀眾席控制台", "控制台 Console 預留", "輪椅區 Wheelchair"] 
                }
            },
            "大劇院": {
                capacity: "座位總數：1708", details: "堂座(1): 297 | 堂座(2): 491 | 樓座: 425 | 高席: 495",
                tags: { 
                    reminders: ["Pre-Talk 演前藝人談 (需4位PTU提早)", "酒會 Reception (需6-8位PTU)", "演後座談 Post-Talk", "後台導賞 (需特別指引)"],
                    vip: ["大堂 2R4C 接待處", "高席 VIP 預留", "需專人引導入座", "酒會區預備"], 
                    audience: ["嚴禁攝影及錄音", "遲到者第一幕後進場", "6歲以下恕不招待", "高席電梯指引"], 
                    rp: ["Podium 放置指示牌", "拉起紅繩圍封", "對講機 Channel 2"], 
                    tech: ["CA 5-17 排", "BQ 13-15 排", "控制台 Console", "樂池 (Orchestra Pit) 封閉"] 
                }
            },
            "小劇場 (劇場)": {
                capacity: "彈性座位配置", details: "單向: 321 | 雙向: 382 | 叁向: 303 | 四向: 496",
                tags: { 
                    reminders: ["演後座談 (2位PTU留守)", "演前分享 (需提早準備)", "演後工作坊"],
                    vip: ["入口接待處", "前排 VIP 預留", "演出後交流會"], 
                    audience: ["自由入座", "嚴禁攝影", "開演後嚴禁進場"], 
                    rp: ["門外放置 A3 指示牌", "排隊動線指引"], 
                    tech: ["單向配置", "四向配置", "舞台邊界圍封", "燈光/音響控制台"] 
                }
            },
            "大堂 (Foyer)": {
                capacity: "開放式空間", details: "無固定座位，適合典禮 / 記者招待會 / 酒會",
                tags: { 
                    reminders: ["大型酒會 (需8位以上PTU)", "開幕儀式 (需人流管制)", "記者招待會"],
                    vip: ["主禮嘉賓接待處", "剪綵區預留", "酒水區", "媒體拍攝區"], 
                    audience: ["自由參觀", "人群管制", "排隊動線指引"], 
                    rp: ["放置多個 A3 指示牌", "紅繩圍封 VIP 區", "背景板佈置", "PA 系統測試"], 
                    tech: ["流動電源", "臨時燈光佈置"] 
                }
            },
            "小型展覽 E1": { capacity: "展覽空間 E1", details: "小型展覽 / 工作坊", tags: { reminders: ["工作坊助理 (需提早)", "展覽導賞"], vip: ["開幕儀式接待"], audience: ["人流管制", "禁止飲食"], rp: ["展板設置", "A4 展品說明", "海報架"], tech: ["電源供應", "獨立照明"] } },
            "小型展覽 E2": { capacity: "展覽空間 E2", details: "小型展覽 / 工作坊", tags: { reminders: ["工作坊助理 (需提早)", "展覽導賞"], vip: ["開幕儀式接待"], audience: ["人流管制", "禁止飲食"], rp: ["展板設置", "A4 展品說明", "海報架"], tech: ["電源供應", "獨立照明"] } },
            "小型展覽 E3": { capacity: "展覽空間 E3", details: "小型展覽 / 工作坊", tags: { reminders: ["工作坊助理 (需提早)", "展覽導賞"], vip: ["開幕儀式接待"], audience: ["人流管制", "禁止飲食"], rp: ["展板設置", "A4 展品說明", "海報架"], tech: ["電源供應", "獨立照明"] } },
            "小型展覽 E4": { capacity: "展覽空間 E4", details: "小型展覽 / 工作坊", tags: { reminders: ["工作坊助理 (需提早)", "展覽導賞"], vip: ["開幕儀式接待"], audience: ["人流管制", "禁止飲食"], rp: ["展板設置", "A4 展品說明", "海報架"], tech: ["電源供應", "獨立照明"] } }
        };

        const DEFAULT_TIMELINE_TAGS = [
            "FOH 開放 (FOH Open)", "觀眾席開放 (House Open)", "節目開始 (Show Start)", 
            "遲到者進場點 (Latecomer Point)", "中場休息 (Intermission)", "下半場開始 (Show Resume)", 
            "節目結束 (Show End)", "演後座談 (Post-Talk)", "清場完畢 (Clear House)"
        ];

        const VENUE_NAMES = Object.keys(DEFAULT_VENUES_DATA);
        const CATEGORY_NAMES = { reminders: "特別安排 (Staffing)", vip: "嘉賓接待 (VIP)", audience: "觀眾管理 (Audience)", rp: "RP 空間任務 (Logistics)", tech: "技術封位 (Tech Blocks)" };
        
        const getTodayDate = () => new Date().toISOString().split('T')[0];

        const App = () => {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [reportData, setReportData] = useState(null);
            const [lightboxImage, setLightboxImage] = useState(null); 
            const [isProcessing, setIsProcessing] = useState(false);
            const fileInputRef = useRef(null);
            
            // --- 狀態庫 ---
            const [records, setRecords] = useState(() => {
                const saved = localStorage.getItem('balance_pro_records_v14');
                return saved ? JSON.parse(saved) : [];
            });

            // 標籤資料庫 (從 localStorage 讀取或使用預設)
            const [venuesData, setVenuesData] = useState(() => {
                const saved = localStorage.getItem('vp_custom_venues');
                return saved ? JSON.parse(saved) : DEFAULT_VENUES_DATA;
            });
            const [timelineTags, setTimelineTags] = useState(() => {
                const saved = localStorage.getItem('vp_custom_timeline');
                return saved ? JSON.parse(saved) : DEFAULT_TIMELINE_TAGS;
            });
            
            // 新增表單
            const [form, setForm] = useState({
                date: getTodayDate(), venue: VENUE_NAMES[0], event_name: "", 
                reminders: "", vip_pillar: "", audience_pillar: "", rp_tasks: "", tech_blocks: "", timeline: "",
                reference_images: []
            });

            // 標籤管理員狀態
            const [tagManagerView, setTagManagerView] = useState('venue'); // 'venue' or 'timeline'
            const [tmVenue, setTmVenue] = useState(VENUE_NAMES[0]);
            const [tmCategory, setTmCategory] = useState('reminders');
            const [newTagText, setNewTagText] = useState("");
            const [editingTag, setEditingTag] = useState(null); // { index, text }

            // 自動儲存
            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
                try {
                    localStorage.setItem('balance_pro_records_v14', JSON.stringify(records));
                    localStorage.setItem('vp_custom_venues', JSON.stringify(venuesData));
                    localStorage.setItem('vp_custom_timeline', JSON.stringify(timelineTags));
                } catch (e) {
                    alert("⚠️ 手機儲存空間不足，請清理過往紀錄或相片。");
                }
            }, [activeTab, reportData, records, form.venue, form.reference_images, lightboxImage, venuesData, timelineTags]);

            // --- 圖片壓縮引擎 ---
            const compressImage = (file) => {
                return new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.readAsDataURL(file);
                    reader.onload = (e) => {
                        const img = new Image();
                        img.src = e.target.result;
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            const MAX_WIDTH = 800; const MAX_HEIGHT = 800;
                            let width = img.width; let height = img.height;
                            if (width > height) { if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; } } 
                            else { if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; } }
                            canvas.width = width; canvas.height = height;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, width, height);
                            resolve(canvas.toDataURL('image/jpeg', 0.5));
                        };
                    };
                });
            };

            const handleImageUpload = async (e) => {
                const files = Array.from(e.target.files);
                if (!files.length) return;
                const currentCount = form.reference_images.length;
                if (currentCount + files.length > 10) {
                    alert(`每個節目最多 10 張相片！您目前已選 ${currentCount} 張。`);
                    if (fileInputRef.current) fileInputRef.current.value = "";
                    return;
                }
                setIsProcessing(true);
                setTimeout(async () => {
                    const newImages = [];
                    for (let file of files) {
                        const compressedBase64 = await compressImage(file);
                        newImages.push(compressedBase64);
                    }
                    setForm(prev => ({ ...prev, reference_images: [...prev.reference_images, ...newImages] }));
                    if (fileInputRef.current) fileInputRef.current.value = "";
                    setIsProcessing(false);
                }, 50);
            };

            const removeImageFromForm = (indexToRemove) => { setForm(prev => ({ ...prev, reference_images: prev.reference_images.filter((_, i) => i !== indexToRemove) })); };

            const appendTag = (field, text) => {
                setForm(prev => {
                    const current = prev[field];
                    if (current.includes(text)) return prev;
                    if (field === 'tech_blocks') return { ...prev, [field]: current ? `${current}, ${text}` : text };
                    if (field === 'timeline') return { ...prev, [field]: current ? `${current}\n[時間] - ${text}` : `[時間] - ${text}` };
                    return { ...prev, [field]: current ? `${current}\n- ${text}` : `- ${text}` };
                });
            };

            const resetForm = () => {
                setForm({ date: getTodayDate(), venue: VENUE_NAMES[0], event_name: "", reminders: "", vip_pillar: "", audience_pillar: "", rp_tasks: "", tech_blocks: "", timeline: "", reference_images: [] });
                if (fileInputRef.current) fileInputRef.current.value = "";
            };

            const generateAndSaveReport = () => {
                if (!form.event_name.trim()) { alert("請輸入「節目/活動名稱」！"); return; }
                const rpArray = form.rp_tasks.split('\n').map(t => t.replace(/^- /, '').replace(/^任務\d+:/, '').trim()).filter(t => t !== '').map((task, index) => ({ task: `任務 ${index + 1}`, detail: task }));

                const newReport = {
                    id: Date.now().toString(), timestamp: new Date().getTime(),
                    date: form.date, venue: form.venue, event_name: form.event_name,
                    reminders: form.reminders || "", vip_pillar: form.vip_pillar || "無特別指示",
                    audience_pillar: form.audience_pillar || "常規運作", rp_pillar: rpArray.length > 0 ? rpArray : [{task: "常規巡查", detail: "保持前台與大堂整潔及動線順暢"}],
                    tech_blocks: form.tech_blocks || "無", timeline: form.timeline || "", reference_images: form.reference_images
                };

                setRecords(prev => [newReport, ...prev]);
                setReportData(newReport);
                setActiveTab('report');
            };

            const viewRecord = (record) => { 
                let displayRecord = { ...record };
                if (!displayRecord.reference_images && displayRecord.reference_image) { displayRecord.reference_images = [displayRecord.reference_image]; } 
                else if (!displayRecord.reference_images) { displayRecord.reference_images = []; }
                setReportData(displayRecord); setActiveTab('report'); 
            };

            const deleteRecord = (id, e) => {
                e.stopPropagation();
                if(confirm("確定要刪除這筆紀錄嗎？(包含相片將一併刪除)")) {
                    setRecords(prev => prev.filter(r => r.id !== id));
                    if (reportData && reportData.id === id) { setReportData(null); setActiveTab('history'); }
                }
            };

            const deleteImageFromSavedRecord = (recordId, imageIndex) => {
                if(confirm("確定要從此紀錄中刪除這張相片嗎？")) {
                    const updatedRecords = records.map(r => {
                        if (r.id === recordId) {
                            let imgs = r.reference_images || (r.reference_image ? [r.reference_image] : []);
                            imgs = imgs.filter((_, i) => i !== imageIndex);
                            return { ...r, reference_images: imgs, reference_image: null };
                        }
                        return r;
                    });
                    setRecords(updatedRecords);
                    setReportData(prev => {
                        let imgs = prev.reference_images || (prev.reference_image ? [prev.reference_image] : []);
                        imgs = imgs.filter((_, i) => i !== imageIndex);
                        return { ...prev, reference_images: imgs, reference_image: null };
                    });
                }
            };

            const clearAllData = () => {
                if(confirm("警告：這將會刪除您手機內所有的過往紀錄與照片！確定要繼續嗎？")) {
                    localStorage.removeItem('balance_pro_records_v14');
                    setRecords([]); setReportData(null); setActiveTab('dashboard');
                    alert("紀錄已完全清空！");
                }
            };

            const copyReportText = () => {
                if (!reportData) return;
                let text = `📅 【FOH 運營報告】\n日期：${reportData.date}\n場地：${reportData.venue}\n節目：${reportData.event_name}\n\n`;
                if (reportData.reminders) { text += `🔔 [人手與特別安排]\n${reportData.reminders}\n\n`; }
                text += `🌟 [VIP 接待]\n${reportData.vip_pillar}\n\n`;
                text += `👥 [觀眾管理]\n${reportData.audience_pillar}\n\n`;
                text += `📦 [RP 空間任務]\n`;
                reportData.rp_pillar.forEach(item => { text += `- ${item.detail}\n`; });
                text += `\n🚫 [技術封位]\n${reportData.tech_blocks}\n\n`;
                if (reportData.timeline) { text += `⏰ [運營時間線]\n${reportData.timeline}\n`; }

                const textArea = document.createElement("textarea");
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                try { document.execCommand('copy'); alert("✅ 報告文字已成功複製！"); } 
                catch (err) { alert("❌ 複製失敗，請手動選取文字複製。"); }
                document.body.removeChild(textArea);
            };

            // --- 標籤管理員 (Tag Manager) 邏輯 ---
            const handleAddTag = () => {
                if (!newTagText.trim()) return;
                if (tagManagerView === 'timeline') {
                    setTimelineTags([...timelineTags, newTagText.trim()]);
                } else {
                    const updated = { ...venuesData };
                    updated[tmVenue].tags[tmCategory] = [...updated[tmVenue].tags[tmCategory], newTagText.trim()];
                    setVenuesData(updated);
                }
                setNewTagText("");
            };

            const handleDeleteTag = (index) => {
                if(!confirm("確定要刪除這個標籤嗎？")) return;
                if (tagManagerView === 'timeline') {
                    setTimelineTags(timelineTags.filter((_, i) => i !== index));
                } else {
                    const updated = { ...venuesData };
                    updated[tmVenue].tags[tmCategory] = updated[tmVenue].tags[tmCategory].filter((_, i) => i !== index);
                    setVenuesData(updated);
                }
            };

            const handleSaveEditTag = () => {
                if (!editingTag.text.trim()) return;
                if (tagManagerView === 'timeline') {
                    const updatedTags = [...timelineTags];
                    updatedTags[editingTag.index] = editingTag.text.trim();
                    setTimelineTags(updatedTags);
                } else {
                    const updated = { ...venuesData };
                    updated[tmVenue].tags[tmCategory][editingTag.index] = editingTag.text.trim();
                    setVenuesData(updated);
                }
                setEditingTag(null);
            };

            const resetTagsToDefault = () => {
                if(confirm("警告：這會將所有標籤恢復為系統最初的原廠設定，您自訂的標籤將會遺失！確定要繼續嗎？")) {
                    setVenuesData(DEFAULT_VENUES_DATA);
                    setTimelineTags(DEFAULT_TIMELINE_TAGS);
                    alert("標籤已恢復預設值！");
                }
            };

            return (
                <div className="flex flex-col h-full overflow-hidden select-none bg-slate-50 text-slate-900">
                    
                    {lightboxImage && (
                        <div className="fixed inset-0 bg-black/95 z-[200] flex flex-col items-center justify-center animate-in fade-in duration-200" onClick={() => setLightboxImage(null)}>
                            <button className="absolute top-10 right-6 p-4 bg-white/10 rounded-full active-scale" onClick={() => setLightboxImage(null)}><i data-lucide="x" className="w-8 h-8 text-white"></i></button>
                            <img src={lightboxImage} className="max-w-full max-h-[85vh] object-contain p-4" />
                            <p className="text-gray-400 text-sm absolute bottom-10 bg-black/50 px-4 py-2 rounded-full backdrop-blur-md"><i data-lucide="zoom-in" className="inline w-4 h-4 mr-1 mb-0.5"></i>雙指可放大查看</p>
                        </div>
                    )}

                    <header className="px-6 pt-12 pb-5 bg-white/90 backdrop-blur-xl border-b border-slate-200 flex justify-between items-center z-50 sticky top-0">
                        <div>
                            <h1 className="text-2xl font-black italic tracking-tighter text-blue-600 uppercase leading-none flex items-center">
                                VENUE PRO <span className="text-[10px] text-slate-400 ml-2 mt-1 not-italic tracking-widest">v23</span>
                            </h1>
                            <p className="text-[10px] font-bold text-teal-600 uppercase mt-1 tracking-widest flex items-center">
                                <i data-lucide="edit-3" className="w-3 h-3 mr-1"></i> 標籤自訂版
                            </p>
                        </div>
                        {activeTab === 'tagManager' ? (
                            <button onClick={() => {setEditingTag(null); setActiveTab('settings');}} className="px-4 py-2 rounded-full bg-slate-100 text-slate-600 font-bold text-xs active-scale">
                                完成設定
                            </button>
                        ) : (
                            <button onClick={() => setActiveTab('settings')} className="w-10 h-10 rounded-full bg-blue-50 border border-blue-100 flex items-center justify-center text-blue-500 shadow-sm active-scale">
                                <i data-lucide="settings" className="w-5 h-5"></i>
                            </button>
                        )}
                    </header>

                    <main className="flex-1 overflow-y-auto p-6 pb-40 no-scrollbar relative">
                        
                        {/* ================= 總覽面板 ================= */}
                        {activeTab === 'dashboard' && (
                            <div className="space-y-8 animate-in fade-in duration-300">
                                <div className="flex justify-between items-end">
                                    <h2 className="text-4xl font-black text-slate-800 leading-tight">運營總覽</h2>
                                </div>
                                <div className="grid grid-cols-2 gap-4">
                                    <div className="bg-white border border-slate-200 p-6 rounded-[32px] shadow-sm">
                                        <p className="text-slate-500 text-[10px] font-bold uppercase tracking-widest mb-1">已存紀錄</p>
                                        <p className="text-4xl font-black text-slate-800 italic">{records.length}</p>
                                    </div>
                                    <div className="bg-blue-50 border border-blue-100 p-6 rounded-[32px] shadow-sm active-scale" onClick={() => setActiveTab('history')}>
                                        <p className="text-blue-600 text-[10px] font-bold uppercase tracking-widest mb-1">過往紀錄</p>
                                        <div className="flex items-center mt-2">
                                            <i data-lucide="folder-open" className="w-8 h-8 text-blue-500 mr-2"></i>
                                            <i data-lucide="arrow-right" className="w-4 h-4 text-blue-400"></i>
                                        </div>
                                    </div>
                                </div>
                                <div className="mt-8">
                                    <button onClick={() => { resetForm(); setActiveTab('builder'); }} className="w-full bg-gradient-to-br from-blue-500 to-indigo-600 p-8 rounded-[40px] active-scale shadow-[0_10px_30px_rgba(59,130,246,0.3)] text-left relative overflow-hidden">
                                        <div className="relative z-10">
                                            <h4 className="font-black text-white text-2xl flex items-center mb-2 italic tracking-tight">
                                                <i data-lucide="zap" className="mr-3 w-8 h-8 text-amber-300"></i> 智選速記建檔
                                            </h4>
                                            <p className="text-sm text-blue-100 font-medium leading-relaxed pr-8">選擇場地，使用您自訂的專屬快捷標籤，10 秒內完成運營紀錄。</p>

                                <section className="space-y-4"><h3 className="text-teal-600 font-black text-sm uppercase tracking-widest px-2 flex items-center"><i data-lucide="box" className="mr-2 w-5 h-5 mb-0.5 text-teal-500"></i>RP 空間任務</h3>{reportData.rp_pillar.map((item, i) => (<div key={i} className="bg-white border-l-4 border-teal-500 p-6 rounded-[24px] shadow-sm space-y-2"><p className="text-2xl font-black tracking-tight text-teal-600">{item.task}</p><p className="text-base text-slate-600 font-medium italic leading-relaxed whitespace-pre-line">{item.detail}</p></div>))}</section>
                                <section className="bg-rose-50 border border-rose-100 p-6 rounded-[32px] shadow-sm"><h3 className="text-rose-600 font-black text-sm uppercase tracking-widest mb-2 flex items-center"><i data-lucide="ban" className="mr-2 w-5 h-5 mb-0.5 text-rose-500"></i>技術封位</h3><p className="text-3xl font-mono text-slate-800 font-black italic tracking-tighter">{reportData.tech_blocks}</p></section>
                                
                                {reportData.reference_images && reportData.reference_images.length > 0 && (

                                        <div className="grid grid-cols-2 gap-3">

                                                <div key={idx} className="relative bg-white border border-slate-200 rounded-2xl flex flex-col active-scale shadow-sm overflow-hidden">

                                                    <div className="p-2 bg-slate-50 flex justify-end border-t border-slate-100"><button onClick={() => deleteImageFromSavedRecord(reportData.id, idx)} className="text-rose-500 bg-white p-1.5 rounded-lg border border-rose-100 shadow-sm"><i data-lucide="trash-2" className="w-4 h-4"></i></button></div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {reportData.timeline && (
                                    <section className="bg-cyan-50 border border-cyan-200 p-6 rounded-[32px] shadow-sm mt-6 relative overflow-hidden"><div className="absolute top-0 right-0 w-32 h-32 bg-cyan-500/5 rounded-bl-full"></div><h3 className="text-sm font-black text-cyan-600 uppercase tracking-widest flex items-center mb-3 relative z-10"><i data-lucide="clock" className="mr-2 w-5 h-5 mb-0.5 text-cyan-500"></i>運營時間線 (Timeline)</h3><p className="text-lg font-mono leading-relaxed whitespace-pre-line text-slate-800 relative z-10 pl-3 border-l-4 border-cyan-400">{reportData.timeline}</p></section>
                                )}

                                <div className="grid grid-cols-2 gap-4 mt-8">
                                    <button onClick={() => setActiveTab('history')} className="w-full bg-white border border-slate-200 text-slate-600 font-black py-5 rounded-[24px] text-sm uppercase active-scale shadow-sm">查看過往紀錄</button>
                                    <button onClick={() => setActiveTab('dashboard')} className="w-full bg-blue-600 text-white font-black py-5 rounded-[24px] text-sm uppercase active-scale shadow-md shadow-blue-500/20">返回主頁</button>
                                </div>

                    </main>

                    <nav className="bg-white border-t border-slate-200 px-6 pb-12 pt-4 flex items-center justify-between sticky bottom-0 z-50 safe-bottom">

                            <i data-lucide="layout-dashboard" className="w-7 h-7 mb-1.5"></i><span className="text-[10px] font-black uppercase">總覽</span>

                                <i data-lucide="plus" className="w-10 h-10 text-white"></i>

                    {isProcessing && (
                        <div className="fixed inset-0 bg-white/80 backdrop-blur-sm z-[100] flex flex-col items-center justify-center p-12 text-center animate-in fade-in duration-200">

                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
