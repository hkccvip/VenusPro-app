```html
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Balance Pro - FOH & RP Master</title>
    <!-- 核心庫 -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { background-color: #050505; color: white; -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
        .active-scale:active { transform: scale(0.95); transition: 0.1s; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .animate-spin-custom { animation: spin 1s linear infinite; }
        /* 隱藏網址列滾動感 */
        html, body { height: 100%; overflow: hidden; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        const App = () => {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [isProcessing, setIsProcessing] = useState(false);
            const [aiResult, setAiResult] = useState(null);
            const [errorMessage, setErrorMessage] = useState("");
            const [isDemoMode, setIsDemoMode] = useState(false);
            
            // 安全機制：Key 只儲存在手機本地 localStorage
            const [userKey, setUserKey] = useState(localStorage.getItem('foh_secure_key') || "");
            const fileInputRef = useRef(null);

            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
                localStorage.setItem('foh_secure_key', userKey);
            }, [activeTab, aiResult, userKey]);

            // --- 演示模式數據 (對應美狄亞實況) ---
            const runDemo = () => {
                setIsProcessing(true);
                setTimeout(() => {
                    setAiResult({
                        event_name: "美狄亞 MEDEA",
                        vip_pillar: "中英劇團：預計 19:30 抵達。由 RP 在 Reception 設置 2R 4C 檯椅，需 2 名人員負責接待並引導至 RP 預留席。",
                        audience_pillar: "12 歲以下禁入。演出中嚴禁攝影（謝幕除外）。Urbtix 驗票設於入口右側。",
                        rp_pillar: [
                            {task: "接待處 (Reception)", detail: "擺放 2 張長檯 (2R) 及 4 張椅子 (4C)，連白色檯布，面向主門。"},
                            {task: "酒會指示牌 (Signage)", detail: "Foyer 入口放置 A3 指示牌 1 個，方向指向 Podium 酒會區。"},
                            {task: "座務封閉 (Seating)", detail: "物理封閉 CA5-17 排座位，掛上「技術預留」告示牌。"},
                            {task: "中場休息圍封", detail: "Intermission 前 5 分鐘於 Foyer Stage 拉起圍欄，區隔酒會區。"}
                        ],
                        tech_blocks: "CA5-17, BQ13-15, DQ16-18, CD1-2, CE1-2, CG1-2"
                    });
                    setActiveTab('report');
                    setIsProcessing(false);
                }, 1500);
            };

            const handleFileAction = async (e) => {
                if (isDemoMode) { runDemo(); return; }

                if (!userKey || userKey.length < 10) {
                    setErrorMessage("安全性提示：請點擊右上角設定，輸入新的 API Key 以啟動。");
                    return;
                }

                const file = e.target.files[0];
                if (!file) return;

                setIsProcessing(true);
                setErrorMessage("");
                const reader = new FileReader();
                reader.onloadend = async () => {
                    const base64Data = reader.result.split(',')[1];
                    const prompt = `分析此場地預約表照片。請以 JSON 格式回傳活動名稱(event_name)、嘉賓接待(vip_pillar)、觀眾管理(audience_pillar)、RP物資任務(rp_pillar: [{task, detail}])、技術封位(tech_blocks)。針對 RP 任務，請務必包含：擺位、方向、桌椅數量與圍封範圍。`;

                    try {
                        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${userKey}`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ contents: [{ parts: [{ text: prompt }, { inlineData: { mimeType: "image/png", data: base64Data } }] }] })
                        });

                        const data = await response.json();
                        if (!response.ok) throw new Error(data.error?.message || "連線異常");

                        const cleanJson = data.candidates[0].content.parts[0].text.replace(/```json/g, "").replace(/```/g, "").trim();
                        setAiResult(JSON.parse(cleanJson));
                        setActiveTab('report');
                    } catch (err) {
                        setErrorMessage(err.message);
                    } finally {
                        setIsProcessing(false);
                    }
                };
                reader.readAsDataURL(file);
            };

            return (
                <div className="flex flex-col h-full overflow-hidden">
                    {/* 頂欄 - 品牌感與安全性 */}
                    <header className="px-6 pt-12 pb-5 border-b border-white/5 bg-black/80 backdrop-blur-2xl flex justify-between items-center sticky top-0 z-50">
                        <div>
                            <h1 className="text-2xl font-black italic tracking-tighter text-indigo-500 uppercase">BALANCE PRO</h1>
                            <div className="flex items-center space-x-2 mt-1">
                                <div className={`w-2 h-2 rounded-full ${isDemoMode ? 'bg-amber-500' : 'bg-green-500'} animate-pulse`}></div>
                                <p className="text-[10px] font-bold text-gray-500 uppercase tracking-widest italic">
                                    {isDemoMode ? 'Demo / Manual Mode' : 'Secured Syncing'}
                                </p>
                            </div>
                        </div>
                        <button onClick={() => setActiveTab('settings')} className="p-3 bg-white/5 rounded-2xl text-gray-400 active-scale border border-white/5">
                            <i data-lucide="settings" className="w-6 h-6"></i>
                        </button>
                    </header>

                    {/* 主內容區 */}
                    <main className="flex-1 overflow-y-auto p-6 pb-40">
                        
                        {activeTab === 'dashboard' && (
                            <div className="space-y-8 animate-in fade-in">
                                <h2 className="text-4xl font-black text-white leading-tight">運營平衡</h2>
                                
                                <div className="grid grid-cols-2 gap-4">
                                    <div className="bg-gray-900 border border-amber-500/20 p-6 rounded-[32px] space-y-1 shadow-2xl">
                                        <p className="text-amber-500 text-xs font-black uppercase tracking-widest">嘉賓抵達</p>
                                        <p className="text-4xl font-black text-white">04 <span className="text-sm text-gray-700">/ 15</span></p>
                                    </div>
                                    <div className="bg-gray-900 border border-indigo-500/20 p-6 rounded-[32px] space-y-1 shadow-2xl">
                                        <p className="text-indigo-500 text-xs font-black uppercase tracking-widest">觀眾進場</p>
                                        <p className="text-4xl font-black text-white">128</p>
                                    </div>
                                </div>

                                {errorMessage && (
                                    <div className="bg-rose-500/10 border border-rose-500/30 p-6 rounded-[32px] space-y-3">
                                        <h4 className="text-rose-500 font-black flex items-center text-lg italic">
                                            <i data-lucide="shield-alert" className="mr-2"></i> 安全性/連線警告
                                        </h4>
                                        <p className="text-sm text-rose-200/80 font-bold leading-relaxed">{errorMessage}</p>
                                        <div className="flex space-x-2">
                                            <button onClick={() => setActiveTab('settings')} className="text-xs bg-rose-600 text-white px-4 py-2 rounded-lg font-black uppercase">更新金鑰</button>
                                            <button onClick={() => setIsDemoMode(true)} className="text-xs bg-white/10 text-white px-4 py-2 rounded-lg font-black uppercase">切換演示</button>
                                        </div>
                                    </div>
                                )}

                                <div className="bg-white/5 p-8 rounded-[40px] border border-white/10 space-y-4">
                                    <h4 className="font-black text-indigo-400 text-xl flex items-center">
                                        <i data-lucide="zap" className="mr-2"></i>即時執行
                                    </h4>
                                    <p className="text-lg text-gray-400 leading-relaxed font-medium">
                                        拍攝 Requirement，系統會平衡 <b>嘉賓、觀眾</b> 與 <b>RP 物資擺位</b> 任務。
                                    </p>
                                </div>
                            </div>
                        )}

                        {activeTab === 'settings' && (
                            <div className="space-y-8 animate-in slide-in-from-right-10">
                                <h2 className="text-3xl font-black text-white">安全性設定</h2>
                                <div className="space-y-6">
                                    <div className="bg-white/5 p-6 rounded-3xl space-y-4 border border-white/5">
                                        <p className="text-sm text-gray-400 font-medium">1. 請刪除收到警告的舊金鑰。<br/>2. 建立新金鑰並貼在下方。<br/>3. 金鑰僅存於此手機，不會上傳 GitHub。</p>
                                        <input 
                                            type="password"
                                            placeholder="在此貼上以 AIzaSy 開頭的金鑰..." 
                                            className="w-full bg-black border border-indigo-500/30 p-5 rounded-2xl text-white font-mono text-lg"
                                            value={userKey}
                                            onChange={(e) => setUserKey(e.target.value)}
                                        />
                                    </div>
                                    <div className="flex items-center justify-between p-5 bg-amber-500/10 border border-amber-500/20 rounded-2xl">
                                        <span className="font-bold text-amber-500">演示模式 (無需 Key)</span>
                                        <input type="checkbox" className="w-6 h-6" checked={isDemoMode} onChange={() => setIsDemoMode(!isDemoMode)} />
                                    </div>
                                    <button onClick={() => setActiveTab('dashboard')} className="w-full bg-indigo-600 text-white font-black py-5 rounded-[32px] text-xl active-scale shadow-2xl shadow-indigo-500/40">
                                        儲存設定並返回
                                    </button>
                                </div>
                            </div>
                        )}

                        {activeTab === 'report' && aiResult && (
                            <div className="space-y-8 animate-in slide-in-from-bottom-10 pb-20">
                                <h2 className="text-3xl font-black text-white italic underline decoration-indigo-500/30">{aiResult.event_name}</h2>
                                
                                <section className="bg-amber-500/10 border border-amber-500/20 p-6 rounded-[40px] space-y-4">
                                    <h3 className="text-sm font-black text-amber-500 uppercase tracking-widest flex items-center"><i data-lucide="star" className="mr-2 w-5 h-5"></i> 嘉賓招待 VIP</h3>
                                    <p className="text-xl text-gray-100 font-bold leading-relaxed">{aiResult.vip_pillar}</p>
                                </section>

                                <section className="bg-indigo-500/10 border border-indigo-500/20 p-6 rounded-[40px] space-y-4">
                                    <h3 className="text-sm font-black text-indigo-400 uppercase tracking-widest flex items-center"><i data-lucide="users" className="mr-2 w-5 h-5"></i> 觀眾管理 General</h3>
                                    <p className="text-xl text-gray-100 font-bold leading-relaxed">{aiResult.audience_pillar}</p>
                                </section>

                                <section className="space-y-4">
                                    <h3 className="text-emerald-500 font-black text-sm uppercase tracking-widest px-2 flex items-center"><i data-lucide="box" className="mr-2 w-5 h-5"></i> RP 物資擺位方案</h3>
                                    {aiResult.rp_pillar.map((item, i) => (
                                        <div key={i} className="bg-gray-900 border-l-4 border-emerald-500 p-6 rounded-2xl shadow-xl space-y-2 active:bg-gray-800 transition-colors">
                                            <p className="text-2xl font-black text-white">{item.task}</p>
                                            <p className="text-lg text-gray-400 leading-relaxed font-medium">{item.detail}</p>
                                        </div>
                                    ))}
                                </section>

                                <section className="bg-rose-500/10 border border-rose-500/20 p-6 rounded-[32px]">
                                    <h3 className="text-rose-500 font-black text-sm uppercase tracking-widest mb-2 flex items-center"><i data-lucide="ban" className="mr-2 w-4 h-4"></i> 物理封位 (Tech Blocks)</h3>
                                    <p className="text-2xl font-mono text-white font-black tracking-tight">{aiResult.tech_blocks}</p>
                                </section>

                                <button onClick={() => setActiveTab('dashboard')} className="w-full bg-white/5 border border-white/10 text-gray-400 font-black py-6 rounded-[32px] active-scale text-xl">
                                    完成並返回總覽
                                </button>
                            </div>
                        )}
                    </main>

                    {/* 底部導航 */}
                    <nav className="bg-black border-t border-white/5 px-4 pb-12 pt-4 flex items-center justify-around sticky bottom-0 z-50 safe-bottom">
                        <button onClick={() => setActiveTab('dashboard')} className={`flex-1 flex flex-col items-center ${activeTab === 'dashboard' ? 'text-white' : 'text-gray-600'}`}>
                            <i data-lucide="layout-dashboard" className="w-8 h-8 mb-1"></i>
                            <span className="text-xs font-black uppercase">總覽</span>
                        </button>
                        
                        <div className="relative -top-12 px-4">
                            <button 
                                onClick={() => fileInputRef.current.click()}
                                className="w-24 h-24 bg-gradient-to-br from-indigo-500 to-indigo-700 rounded-full flex items-center justify-center shadow-[0_0_50px_rgba(79,70,229,0.7)] border-[8px] border-[#050505] active-scale"
                            >
                                <i data-lucide="camera" className="w-10 h-10 text-white"></i>
                            </button>
                            <input type="file" ref={fileInputRef} onChange={handleFileAction} accept="image/*" className="hidden" />
                        </div>

                        <button onClick={() => setActiveTab('report')} className={`flex-1 flex flex-col items-center ${activeTab === 'report' ? 'text-emerald-500' : 'text-gray-600'}`}>
                            <i data-lucide="clipboard-list" className="w-8 h-8 mb-1"></i>
                            <span className="text-xs font-black uppercase">報告</span>
                        </button>
                    </nav>

                    {/* 處理中全螢幕 */}
                    {isProcessing && (
                        <div className="fixed inset-0 bg-black/98 z-[100] flex flex-col items-center justify-center p-12 text-center">
                            <div className="animate-spin-custom mb-10 text-indigo-500">
                                <i data-lucide="refresh-cw" className="w-20 h-20"></i>
                            </div>
                            <h3 className="text-4xl font-black italic tracking-widest text-white uppercase">Balancing</h3>
                            <p className="text-gray-400 text-xl mt-6 font-bold leading-relaxed italic">正在整理嘉賓、觀眾與 RP 空間細節...<br/>(請確保已開啟 VPN)</p>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

```
