```html
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Balance Pro - 診斷修復版</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { background-color: #050505; color: white; -webkit-tap-highlight-color: transparent; font-family: -apple-system, system-ui, sans-serif; height: 100vh; }
        .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
        .active-scale:active { transform: scale(0.95); transition: 0.1s; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .animate-spin-custom { animation: spin 1s linear infinite; }
        html, body { overflow: hidden; margin: 0; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        const App = () => {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [isProcessing, setIsProcessing] = useState(false);
            const [aiResult, setAiResult] = useState(null);
            const [errorMessage, setErrorMessage] = useState("");
            const [debugInfo, setDebugInfo] = useState("");
            const [isDemoMode, setIsDemoMode] = useState(false);
            const [userKey, setUserKey] = useState(localStorage.getItem('foh_v4_key') || "");
            const fileInputRef = useRef(null);

            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
                localStorage.setItem('foh_v4_key', userKey);
            }, [activeTab, aiResult, userKey, errorMessage]);

            // --- 測試 API 健康狀態 ---
            const checkApiHealth = async () => {
                if (!userKey) { alert("請先輸入 API Key"); return; }
                setIsProcessing(true);
                try {
                    const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${userKey}`);
                    const data = await resp.json();
                    if (resp.ok) {
                        const models = data.models.map(m => m.name.replace('models/', '')).join(', ');
                        setDebugInfo(`可用模型清單：${models}`);
                        alert("API 連線成功！您的 Key 支援多個模型。");
                    } else {
                        throw new Error(data.error?.message || "連線失敗");
                    }
                } catch (err) {
                    setDebugInfo(`健康檢查失敗：${err.message}`);
                    alert("檢查失敗，請確認 VPN 是否已開啟。");
                } finally {
                    setIsProcessing(false);
                }
            };

            const runDemo = () => {
                setIsProcessing(true);
                setTimeout(() => {
                    setAiResult({
                        event_name: "美狄亞 MEDEA",
                        vip_pillar: "中英劇團嘉賓：預計 19:30 抵達。由 RP 在 Reception 設置 2R 4C 檯椅，需 2 名人員負責接待並引導至 RP 預留席。",
                        audience_pillar: "12 歲以下禁入。演出中嚴禁攝影（謝幕除外）。Urbtix 驗票設於入口右側。",
                        rp_pillar: [
                            {task: "接待處 (Reception)", detail: "擺放 2 張長檯 (2R) 及 4 張椅子 (4C)，連白色檯布。"},
                            {task: "酒會指示牌", detail: "Foyer 入口放置 A3 指示牌，指向 Podium 區域。"}
                        ],
                        tech_blocks: "CA5-17, BQ13-15, DQ16-18"
                    });
                    setActiveTab('report');
                    setIsProcessing(false);
                }, 1000);
            };

            const handleFileAction = async (e) => {
                if (isDemoMode) { runDemo(); return; }
                if (!userKey) { setErrorMessage("請先設定 API Key 或開啟模擬模式。"); return; }

                const file = e.target.files[0];
                if (!file) return;

                setIsProcessing(true);
                setErrorMessage("");
                setDebugInfo("");
                
                const reader = new FileReader();
                reader.onloadend = async () => {
                    const base64Data = reader.result.split(',')[1];
                    const prompt = `分析此照片，回傳 JSON：{"event_name": "活動名", "vip_pillar": "嘉賓招待", "audience_pillar": "觀眾管理", "rp_pillar": [{"task": "物資", "detail": "細節"}], "tech_blocks": "座位號"}`;

                    // 使用 v1beta 配合正確的模型路徑格式
                    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${userKey}`;

                    try {
                        const response = await fetch(url, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                contents: [{ parts: [{ text: prompt }, { inlineData: { mimeType: "image/png", data: base64Data } }] }]
                            })
                        });

                        const data = await response.json();
                        if (!response.ok) {
                            setDebugInfo(JSON.stringify(data, null, 2));
                            throw new Error(data.error?.message || "Google 拒絕請求");
                        }

                        const rawText = data.candidates[0].content.parts[0].text;
                        const cleanJson = rawText.replace(/```json/g, "").replace(/```/g, "").trim();
                        setAiResult(JSON.parse(cleanJson));
                        setActiveTab('report');
                    } catch (err) {
                        setErrorMessage(err.message);
                    } finally {
                        setIsProcessing(false);
                    }
                };
                reader.readAsDataURL(file);
            };

            return (
                <div className="flex flex-col h-full overflow-hidden">
                    <header className="px-6 pt-12 pb-5 border-b border-white/5 bg-black/80 backdrop-blur-xl flex justify-between items-center sticky top-0 z-50">
                        <div>
                            <h1 className="text-2xl font-black italic tracking-tighter text-indigo-500 uppercase">BALANCE PRO</h1>
                            <p className="text-[10px] font-bold text-gray-500 uppercase tracking-widest mt-1">
                                {isDemoMode ? '● 模擬模式' : '● 實時診斷中'}
                            </p>
                        </div>
                        <button onClick={() => setActiveTab('settings')} className="p-3 bg-white/5 rounded-2xl text-gray-400 active-scale border border-white/5">
                            <i data-lucide="settings" className="w-6 h-6"></i>
                        </button>
                    </header>

                    <main className="flex-1 overflow-y-auto p-6 pb-40">
                        {activeTab === 'dashboard' && (
                            <div className="space-y-8 animate-in fade-in">
                                <h2 className="text-4xl font-black text-white leading-tight">運營現況</h2>
                                
                                <div className="grid grid-cols-2 gap-4">
                                    <div className="bg-gray-900 border border-amber-500/20 p-6 rounded-[32px] space-y-1">
                                        <p className="text-amber-500 text-xs font-black uppercase">嘉賓抵達</p>
                                        <p className="text-4xl font-black text-white">04</p>
                                    </div>
                                    <div className="bg-gray-900 border border-indigo-500/20 p-6 rounded-[32px] space-y-1">
                                        <p className="text-indigo-500 text-xs font-black uppercase">觀眾進場</p>
                                        <p className="text-4xl font-black text-white">128</p>
                                    </div>
                                </div>

                                {errorMessage && (
                                    <div className="bg-rose-500/10 border border-rose-500/30 p-6 rounded-[32px] space-y-3">
                                        <h4 className="text-rose-500 font-black flex items-center text-lg italic"><i data-lucide="alert-triangle" className="mr-2"></i> 分析失敗</h4>
                                        <p className="text-sm text-rose-100 font-bold leading-relaxed">{errorMessage}</p>
                                        <div className="p-3 bg-black/40 rounded-xl text-[10px] font-mono text-gray-500 overflow-x-auto">
                                            {debugInfo || "無詳細偵錯資訊"}
                                        </div>
                                        <div className="flex space-x-2 pt-2">
                                            <button onClick={() => setActiveTab('settings')} className="flex-1 bg-rose-600 py-3 rounded-xl font-black text-xs">修復金鑰</button>
                                            <button onClick={() => setIsDemoMode(true)} className="flex-1 bg-white/10 py-3 rounded-xl font-black text-xs">切換模擬</button>
                                        </div>
                                    </div>
                                )}

                                <div className="bg-white/5 p-8 rounded-[40px] border border-white/10 space-y-4 shadow-xl">
                                    <h4 className="font-black text-indigo-400 text-xl flex items-center"><i data-lucide="zap" className="mr-2"></i>任務掃描</h4>
                                    <p className="text-lg text-gray-400 leading-relaxed font-medium italic">拍攝 Requirement 文件，AI 將自動平衡三方動態。</p>
                                </div>
                            </div>
                        )}

                        {activeTab === 'settings' && (
                            <div className="space-y-8 animate-in slide-in-from-right-10">
                                <h2 className="text-3xl font-black text-white">系統診斷</h2>
                                <div className="space-y-6">
                                    <div className="bg-white/5 p-6 rounded-3xl border border-white/10 space-y-4">
                                        <p className="text-xs text-gray-500 font-bold uppercase tracking-widest">Google API Key</p>
                                        <input 
                                            type="password"
                                            placeholder="AIzaSy..." 
                                            className="w-full bg-black border border-white/10 p-5 rounded-2xl text-white font-mono text-lg"
                                            value={userKey}
                                            onChange={(e) => setUserKey(e.target.value)}
                                        />
                                        <button onClick={checkApiHealth} className="w-full bg-white/10 py-3 rounded-xl text-xs font-black text-indigo-400 uppercase tracking-widest border border-indigo-500/20 active-scale">
                                            檢查 API 健康狀態 & 模型清單
                                        </button>
                                    </div>

                                    <div className="flex items-center justify-between p-6 bg-amber-500/10 border border-amber-500/20 rounded-3xl">
                                        <div className="space-y-1">
                                            <p className="font-black text-amber-500 text-lg">演示模式 (Offline)</p>
                                            <p className="text-[10px] text-amber-500/60 uppercase font-bold tracking-widest">無須 API 與 VPN</p>
                                        </div>
                                        <input type="checkbox" className="w-8 h-8 rounded-lg accent-amber-500" checked={isDemoMode} onChange={() => setIsDemoMode(!isDemoMode)} />
                                    </div>

                                    <button onClick={() => setActiveTab('dashboard')} className="w-full bg-indigo-600 text-white font-black py-6 rounded-[32px] text-xl active-scale shadow-2xl">
                                        確認儲存並返回
                                    </button>
                                    
                                    {debugInfo && (
                                        <div className="p-4 bg-gray-900 border border-white/5 rounded-2xl text-[10px] font-mono text-gray-500 whitespace-pre-wrap">
                                            {debugInfo}
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {activeTab === 'report' && aiResult && (
                            <div className="space-y-8 animate-in slide-in-from-bottom-10 pb-20">
                                <h2 className="text-3xl font-black text-white italic underline decoration-indigo-500/30 tracking-tighter uppercase">{aiResult.event_name}</h2>
                                <section className="bg-amber-500/10 border border-amber-500/20 p-6 rounded-[40px] space-y-3">
                                    <h3 className="text-xs font-black text-amber-500 uppercase tracking-widest flex items-center"><i data-lucide="star" className="mr-2 w-4 h-4"></i> VIP 接待</h3>
                                    <p className="text-xl text-gray-100 font-bold leading-relaxed">{aiResult.vip_pillar}</p>
                                </section>
                                <section className="bg-indigo-500/10 border border-indigo-500/20 p-6 rounded-[40px] space-y-3">
                                    <h3 className="text-xs font-black text-indigo-400 uppercase tracking-widest flex items-center"><i data-lucide="users" className="mr-2 w-4 h-4"></i> 觀眾管理</h3>
                                    <p className="text-xl text-gray-100 font-bold leading-relaxed">{aiResult.audience_pillar}</p>
                                </section>
                                <section className="space-y-4">
                                    <h3 className="text-emerald-500 font-black text-xs uppercase tracking-widest px-2 flex items-center"><i data-lucide="box" className="mr-2 w-4 h-4"></i> RP 擺位任務</h3>
                                    {aiResult.rp_pillar.map((item, i) => (
                                        <div key={i} className="bg-gray-900 border-l-4 border-emerald-500 p-6 rounded-2xl shadow-xl space-y-1 active-scale">
                                            <p className="text-2xl font-black text-white tracking-tight">{item.task}</p>
                                            <p className="text-lg text-gray-400 font-medium leading-relaxed">{item.detail}</p>
                                        </div>
                                    ))}
                                </section>
                                <section className="bg-rose-500/10 border border-rose-500/20 p-6 rounded-[32px] space-y-2">
                                    <h3 className="text-rose-500 font-black text-xs uppercase tracking-widest flex items-center"><i data-lucide="ban" className="mr-2 w-4 h-4"></i> 封位席號 (Tech)</h3>
                                    <p className="text-2xl font-mono text-white font-black tracking-tighter italic">{aiResult.tech_blocks}</p>
                                </section>
                                <button onClick={() => setActiveTab('dashboard')} className="w-full bg-white/5 border border-white/10 text-gray-500 font-black py-6 rounded-[32px] text-xl uppercase italic">Close Report</button>
                            </div>
                        )}
                    </main>

                    <nav className="bg-black border-t border-white/5 px-4 pb-12 pt-4 flex items-center justify-around sticky bottom-0 z-50 safe-bottom">
                        <button onClick={() => setActiveTab('dashboard')} className={`flex-1 flex flex-col items-center ${activeTab === 'dashboard' ? 'text-white' : 'text-gray-600'}`}>
                            <i data-lucide="layout-dashboard" className="w-8 h-8 mb-1"></i>
                            <span className="text-[10px] font-black uppercase">總覽</span>
                        </button>
                        <div className="relative -top-12 px-4">
                            <button onClick={() => fileInputRef.current.click()} className="w-24 h-24 bg-gradient-to-br from-indigo-500 to-indigo-700 rounded-full flex items-center justify-center shadow-[0_0_50px_rgba(79,70,229,0.7)] border-[8px] border-[#050505] active-scale">
                                <i data-lucide="camera" className="w-10 h-10 text-white"></i>
                            </button>
                            <input type="file" ref={fileInputRef} onChange={handleFileAction} accept="image/*" className="hidden" />
                        </div>
                        <button onClick={() => setActiveTab('report')} className={`flex-1 flex flex-col items-center ${activeTab === 'report' ? 'text-emerald-500' : 'text-gray-600'}`}>
                            <i data-lucide="clipboard-list" className="w-8 h-8 mb-1"></i>
                            <span className="text-[10px] font-black uppercase">報告</span>
                        </button>
                    </nav>

                    {isProcessing && (
                        <div className="fixed inset-0 bg-black/98 z-[100] flex flex-col items-center justify-center p-12 text-center animate-in fade-in duration-300">
                            <div className="animate-spin-custom mb-10 text-indigo-500"><i data-lucide="refresh-cw" className="w-20 h-20"></i></div>
                            <h3 className="text-4xl font-black italic tracking-widest text-white uppercase">Balancing</h3>
                            <p className="text-gray-400 text-xl mt-6 font-bold leading-relaxed">{isDemoMode ? '模擬數據同步中...' : '正在連線 AI 並偵測三方權限... (請確保 VPN 開啟)'}</p>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

```
