```html
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Balance Pro - FOH & RP 智管家</title>
    <!-- 載入核心庫：React, Tailwind, Lucide Icons -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { background-color: #050505; color: white; -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
        .active-scale:active { transform: scale(0.92); transition: 0.1s; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .animate-spin-custom { animation: spin 1s linear infinite; }
        .custom-shadow { shadow-lg shadow-indigo-500/20; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        const App = () => {
            // --- 狀態管理 ---
            const [activeTab, setActiveTab] = useState('dashboard');
            const [isProcessing, setIsProcessing] = useState(false);
            const [aiResult, setAiResult] = useState(null);
            const [errorMessage, setErrorMessage] = useState("");
            
            // 從本地儲存讀取 Key，方便手機端即時修復
            const [userKey, setUserKey] = useState(localStorage.getItem('foh_gemini_key') || "");
            const fileInputRef = useRef(null);

            // ==========================================
            // 預設 API KEY (請在下方引號內填入你的 Key)
            // ==========================================
            const DEFAULT_API_KEY = "AIzaSyBxLxfefhtO_-Iac2XSmkbwBPK2SAELLbw"; 

            const getActiveKey = () => userKey || DEFAULT_API_KEY;

            // 確保 Lucide 圖示正確渲染
            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
                if (userKey) localStorage.setItem('foh_gemini_key', userKey);
            }, [activeTab, aiResult, userKey]);

            // --- 核心解析功能 ---
            const handleFileSelect = async (e) => {
                const file = e.target.files[0];
                const finalKey = getActiveKey();
                
                if (!finalKey || finalKey.length < 10) {
                    setErrorMessage("請先點擊右上角設定 API Key");
                    return;
                }
                
                if (!file) return;

                setIsProcessing(true);
                setErrorMessage("");
                const reader = new FileReader();
                reader.onloadend = async () => {
                    const base64Data = reader.result.split(',')[1];
                    
                    const prompt = `你是一個資深的表演場地前台經理。分析這張圖片，並嚴格按照以下 JSON 格式回傳（不含 markdown）：
                    {
                      "event_name": "活動名稱",
                      "vip_pillar": "詳細描述嘉賓接待、桌椅配置、預留位及儀式",
                      "audience_pillar": "描述觀眾入場規則、攝影限制、年齡限制及驗票",
                      "rp_pillar": [
                        {"task": "物資名稱", "detail": "詳細擺位、方向、數量、圍封要求"}
                      ],
                      "tech_blocks": "列出所有封閉座位編號"
                    }`;

                    try {
                        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${finalKey}`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                contents: [{ parts: [{ text: prompt }, { inlineData: { mimeType: "image/png", data: base64Data } }] }]
                            })
                        });

                        const data = await response.json();

                        if (!response.ok) {
                            throw new Error(data.error?.message || "API 連線異常");
                        }

                        const rawText = data.candidates[0].content.parts[0].text;
                        const cleanJson = rawText.replace(/```json/g, "").replace(/```/g, "").trim();
                        const parsed = JSON.parse(cleanJson);

                        setAiResult(parsed);
                        setActiveTab('report');
                    } catch (error) {
                        console.error(error);
                        setErrorMessage(error.message);
                    } finally {
                        setIsProcessing(false);
                    }
                };
                reader.readAsDataURL(file);
            };

            return (
                <div className="flex flex-col h-screen overflow-hidden">
                    {/* 頂欄 */}
                    <header className="px-6 pt-12 pb-5 border-b border-white/10 bg-black/60 backdrop-blur-xl flex justify-between items-center sticky top-0 z-50">
                        <div>
                            <h1 className="text-2xl font-black italic tracking-tighter text-indigo-500 uppercase">BALANCE PRO</h1>
                            <p className="text-[10px] font-bold text-green-500 uppercase tracking-widest mt-1 italic">● 實時同步模式</p>
                        </div>
                        <button onClick={() => setActiveTab('settings')} className="p-3 bg-white/5 rounded-2xl text-gray-400 active-scale">
                            <i data-lucide="settings" className="w-6 h-6"></i>
                        </button>
                    </header>

                    {/* 主內容 */}
                    <main className="flex-1 overflow-y-auto p-6 pb-32">
                        
                        {/* 面板 1: 數據總覽 */}
                        {activeTab === 'dashboard' && (
                            <div className="space-y-8 animate-in fade-in">
                                <h2 className="text-4xl font-black text-white leading-tight">運營平衡</h2>
                                
                                <div className="grid grid-cols-2 gap-4">
                                    <div className="bg-gray-900 border border-amber-500/20 p-6 rounded-[32px] space-y-2">
                                        <p className="text-amber-500 text-xs font-black uppercase tracking-widest">嘉賓抵達</p>
                                        <p className="text-4xl font-black text-white">04 <span className="text-sm text-gray-700">/ 15</span></p>
                                    </div>
                                    <div className="bg-gray-900 border border-indigo-500/20 p-6 rounded-[32px] space-y-2">
                                        <p className="text-indigo-500 text-xs font-black uppercase tracking-widest">觀眾進場</p>
                                        <p className="text-4xl font-black text-white">128</p>
                                    </div>
                                </div>

                                {errorMessage && (
                                    <div className="bg-rose-500/10 border border-rose-500/30 p-6 rounded-[32px] space-y-2">
                                        <h4 className="text-rose-500 font-black flex items-center text-lg">
                                            <i data-lucide="alert-circle" className="mr-2"></i> 解析出錯
                                        </h4>
                                        <p className="text-base text-rose-200/80 leading-relaxed font-bold italic">{errorMessage}</p>
                                        <button onClick={() => setActiveTab('settings')} className="text-sm text-white bg-rose-600 px-4 py-2 rounded-xl mt-2 font-bold">重新設定金鑰</button>
                                    </div>
                                )}

                                <div className="bg-white/5 p-8 rounded-[40px] border border-white/10 space-y-3 shadow-2xl">
                                    <h4 className="font-black text-indigo-400 text-xl flex items-center">
                                        <i data-lucide="zap" className="mr-2"></i>即時操作
                                    </h4>
                                    <p className="text-lg text-gray-400 leading-relaxed">
                                        點擊下方相機，拍攝 Requirements，AI 會自動為你整理 <b>嘉賓招待</b> 與 <b>RP 物資任務</b>。
                                    </p>
                                </div>
                            </div>
                        )}

                        {/* 面板 2: 設定 (修復 Key 用) */}
                        {activeTab === 'settings' && (
                            <div className="space-y-8 animate-in slide-in-from-right-10">
                                <h2 className="text-3xl font-black text-white">系統設定</h2>
                                <div className="space-y-4">
                                    <label className="text-sm font-bold text-gray-500 uppercase tracking-widest">Gemini API Key</label>
                                    <input 
                                        type="password"
                                        placeholder="貼上 AIzaSy 開頭的金鑰..." 
                                        className="w-full bg-gray-900 border border-white/10 p-5 rounded-2xl text-white font-mono text-base"
                                        value={userKey}
                                        onChange={(e) => setUserKey(e.target.value)}
                                    />
                                    <button onClick={() => setActiveTab('dashboard')} className="w-full bg-indigo-600 text-white font-black py-5 rounded-[24px] text-lg active-scale">
                                        儲存並返回
                                    </button>
                                    <p className="text-center text-xs text-gray-600 italic">金鑰將安全地儲存在此手機瀏覽器中</p>
                                </div>
                            </div>
                        )}

                        {/* 面板 3: AI 解析報告 */}
                        {activeTab === 'report' && aiResult && (
                            <div className="space-y-8 animate-in slide-in-from-bottom-10 pb-10">
                                <h2 className="text-2xl font-black text-indigo-400 italic underline decoration-indigo-500/30">{aiResult.event_name}</h2>
                                
                                <div className="bg-amber-500/10 border border-amber-500/20 p-6 rounded-[32px]">
                                    <h3 className="text-amber-500 font-black text-sm uppercase tracking-widest mb-3 flex items-center"><i data-lucide="star" className="mr-2 w-4 h-4"></i> 嘉賓接待</h3>
                                    <p className="text-lg text-gray-100 font-bold leading-relaxed">{aiResult.vip_pillar}</p>
                                </div>

                                <div className="space-y-4">
                                    <h3 className="text-emerald-500 font-black text-sm uppercase tracking-widest px-2 flex items-center"><i data-lucide="box" className="mr-2 w-4 h-4"></i> RP 物資與擺位任務</h3>
                                    {aiResult.rp_pillar.map((item, i) => (
                                        <div key={i} className="bg-gray-900 border-l-4 border-emerald-600 p-6 rounded-2xl shadow-xl">
                                            <p className="text-xl font-black text-white">{item.task}</p>
                                            <p className="text-base text-gray-400 mt-2 leading-relaxed">{item.detail}</p>
                                        </div>
                                    ))}
                                </div>

                                <div className="bg-rose-500/10 border border-rose-500/20 p-6 rounded-[32px]">
                                    <h3 className="text-rose-500 font-black text-sm uppercase tracking-widest mb-2 flex items-center"><i data-lucide="ban" className="mr-2 w-4 h-4"></i> 封位資訊</h3>
                                    <p className="text-2xl font-mono text-white font-black tracking-tight">{aiResult.tech_blocks}</p>
                                </div>

                                <button onClick={() => setActiveTab('dashboard')} className="w-full bg-white/10 text-gray-500 font-black py-5 rounded-[28px] active-scale">
                                    完成並返回總覽
                                </button>
                            </div>
                        )}
                    </main>

                    {/* 底部導航 */}
                    <nav className="bg-black border-t border-white/10 px-4 pb-12 pt-4 flex items-center justify-around sticky bottom-0 z-50 safe-bottom">
                        <button onClick={() => setActiveTab('dashboard')} className={`flex-1 flex flex-col items-center ${activeTab === 'dashboard' ? 'text-white' : 'text-gray-600'}`}>
                            <i data-lucide="layout-dashboard" className="w-8 h-8 mb-1"></i>
                            <span className="text-[10px] font-black uppercase tracking-tighter">總覽</span>
                        </button>
                        
                        <div className="relative -top-12 px-4">
                            <button 
                                onClick={() => fileInputRef.current.click()}
                                className="w-24 h-24 bg-indigo-600 rounded-full flex items-center justify-center shadow-[0_0_40px_rgba(79,70,229,0.6)] border-[8px] border-[#050505] active-scale"
                            >
                                <i data-lucide="camera" className="w-10 h-10 text-white"></i>
                            </button>
                            {/* 核心：支援拍照與相簿 */}
                            <input type="file" ref={fileInputRef} onChange={handleFileSelect} accept="image/*" className="hidden" />
                        </div>

                        <button onClick={() => setActiveTab('report')} className={`flex-1 flex flex-col items-center ${activeTab === 'report' ? 'text-emerald-500' : 'text-gray-600'}`}>
                            <i data-lucide="clipboard-list" className="w-8 h-8 mb-1"></i>
                            <span className="text-[10px] font-black uppercase tracking-tighter">報告</span>
                        </button>
                    </nav>

                    {/* AI 處理中 */}
                    {isProcessing && (
                        <div className="fixed inset-0 bg-black/98 z-[100] flex flex-col items-center justify-center p-12 text-center">
                            <div className="animate-spin-custom mb-10 text-indigo-500">
                                <i data-lucide="refresh-cw" className="w-20 h-20"></i>
                            </div>
                            <h3 className="text-4xl font-black italic tracking-widest text-white uppercase">ANALYZING</h3>
                            <p className="text-gray-400 text-xl mt-6 font-bold leading-relaxed">正在同步 FOH 三方數據<br/>(請確保已開啟 VPN)</p>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

```
