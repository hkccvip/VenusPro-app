<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Balance Pro - 實戰版</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #050505; color: white; -webkit-tap-highlight-color: transparent; }
        .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
        .active-scale:active { transform: scale(0.95); transition: 0.1s; }
        .loading-ring { border: 4px solid rgba(255,255,255,0.1); border-top: 4px solid #4f46e5; border-radius: 50%; width: 40px; height: 40px; animate: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef } = React;

        const App = () => {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [isProcessing, setIsProcessing] = useState(false);
            const [rpData, setRpData] = useState([]); // 存儲 AI 解析後的 RP 物資
            const [vipStatus, setVipStatus] = useState("等待掃描...");
            const fileInputRef = useRef(null);

            // 請在此處填入你的 Gemini API Key
            const API_KEY = "AIzaSyBxLxfefhtO_-Iac2XSmkbwBPK2SAELLbw"; 

            const handleFileUpload = async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                setIsProcessing(true);
                const reader = new FileReader();
                reader.onloadend = async () => {
                    const base64Data = reader.result.split(',')[1];
                    
                    const prompt = `你是一個表演場地前台經理。請分析這張照片中的物資與嘉賓需求，並以 JSON 格式回傳：
                    {
                      "vip_note": "嘉賓接待重點簡述",
                      "rp_list": [{"item": "物資名稱", "detail": "擺位與方向細節"}]
                    }`;

                    try {
                        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                contents: [{ parts: [{ text: prompt }, { inlineData: { mimeType: "image/png", data: base64Data } }] }]
                            })
                        });

                        const data = await response.json();
                        const rawText = data.candidates[0].content.parts[0].text;
                        const cleanJson = rawText.replace(/```json/g, "").replace(/```/g, "").trim();
                        const parsed = JSON.parse(cleanJson);

                        setRpData(parsed.rp_list); // 將數據存入 RP 分頁
                        setVipStatus(parsed.vip_note);
                        alert("AI 分析完成！物資資料已更新至 RP 分頁。");
                    } catch (error) {
                        console.error(error);
                        alert("解析失敗，請確認 API Key 是否正確。");
                    } finally {
                        setIsProcessing(false);
                    }
                };
                reader.readAsDataURL(file);
            };

            return (
                <div className="flex flex-col h-screen overflow-hidden">
                    {/* 頂欄 */}
                    <header className="px-6 pt-12 pb-4 border-b border-white/10 bg-black/50 backdrop-blur-xl flex justify-between items-center">
                        <div>
                            <h1 className="text-xl font-black italic tracking-tighter text-indigo-500 uppercase">Balance Pro</h1>
                            <p className="text-[10px] font-bold text-green-500 uppercase tracking-widest">● 行動同步模式</p>
                        </div>
                    </header>

                    {/* 主內容區 */}
                    <main className="flex-1 overflow-y-auto p-6">
                        {activeTab === 'dashboard' && (
                            <div className="space-y-6">
                                <h2 className="text-3xl font-black leading-tight">前台運營現況</h2>
                                <div className="grid grid-cols-2 gap-4">
                                    <div className="bg-gray-900 border border-amber-500/20 p-5 rounded-[32px]">
                                        <p className="text-gray-500 text-[10px] font-bold uppercase mb-1">嘉賓狀態</p>
                                        <p className="text-lg font-bold text-amber-500 leading-tight">{vipStatus}</p>
                                    </div>
                                    <div className="bg-gray-900 border border-indigo-500/20 p-5 rounded-[32px]">
                                        <p className="text-gray-500 text-[10px] font-bold uppercase mb-1">觀眾進場</p>
                                        <p className="text-3xl font-black">128</p>
                                    </div>
                                </div>
                                <div className="bg-white/5 p-6 rounded-[32px] border border-white/10">
                                    <h4 className="font-bold text-indigo-400">使用說明</h4>
                                    <p className="text-sm text-gray-400 mt-2">點擊下方相機圖示，拍攝當日紙本 Requirement，系統會自動提取 RP 物資清單。</p>
                                </div>
                            </div>
                        )}

                        {activeTab === 'rp' && (
                            <div className="space-y-6">
                                <h2 className="text-3xl font-black leading-tight">RP 物資清單</h2>
                                {rpData.length > 0 ? (
                                    <div className="space-y-4">
                                        {rpData.map((task, i) => (
                                            <div key={i} className="bg-gray-900 border border-emerald-500/20 p-5 rounded-[24px]">
                                                <p className="text-emerald-500 font-black text-lg">#{i+1} {task.item}</p>
                                                <p className="text-gray-400 text-sm mt-1">{task.detail}</p>
                                            </div>
                                        ))}
                                    </div>
                                ) : (
                                    <div className="text-center py-20 text-gray-600">
                                        <p className="text-4xl mb-4">📦</p>
                                        <p>尚未掃描資料，請先使用相機拍攝</p>
                                    </div>
                                )}
                            </div>
                        )}
                    </main>

                    {/* 底部導航 */}
                    <nav className="bg-black border-t border-white/10 px-4 pb-10 pt-4 flex items-center justify-around sticky bottom-0 safe-bottom">
                        <button onClick={() => setActiveTab('dashboard')} className={`flex-1 flex flex-col items-center ${activeTab === 'dashboard' ? 'text-indigo-500' : 'text-gray-600'}`}>
                            <span className="text-2xl">📊</span>
                            <span className="text-[10px] font-bold">總覽</span>
                        </button>
                        
                        <div className="relative -top-8 px-4">
                            <button 
                                onClick={() => fileInputRef.current.click()}
                                className="w-20 h-20 bg-indigo-600 rounded-full flex items-center justify-center shadow-2xl border-[6px] border-[#050505] active-scale"
                            >
                                <span className="text-3xl">📷</span>
                            </button>
                            {/* 隱藏的相機輸入，capture="environment" 會直接開啟相機 */}
                            <input 
                                type="file" 
                                ref={fileInputRef} 
                                onChange={handleFileUpload} 
                                accept="image/*" 
                                capture="environment" 
                                className="hidden" 
                            />
                        </div>

                        <button onClick={() => setActiveTab('rp')} className={`flex-1 flex flex-col items-center ${activeTab === 'rp' ? 'text-emerald-500' : 'text-gray-600'}`}>
                            <span className="text-2xl">📦</span>
                            <span className="text-[10px] font-bold">RP物資</span>
                        </button>
                    </nav>

                    {/* 全螢幕讀取中 */}
                    {isProcessing && (
                        <div className="fixed inset-0 bg-black/95 z-[100] flex flex-col items-center justify-center">
                            <div className="loading-ring mb-6"></div>
                            <h3 className="text-2xl font-black italic tracking-widest">ANALYZING...</h3>
                            <p className="text-gray-500 text-sm mt-2">正在讀取紙本數據並分配 RP 任務</p>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
